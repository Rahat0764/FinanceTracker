<script>
  // Force reset language cache to ensure ENGLISH default for everyone
  const LANG_VERSION = '4';
  if (localStorage.getItem('vault_lang_version') !== LANG_VERSION) {
    localStorage.removeItem('vault_lang');
    localStorage.setItem('vault_lang_version', LANG_VERSION);
  }
  window.lang = localStorage.getItem('vault_lang') || 'en';
  document.documentElement.lang = window.lang;

  if (localStorage.getItem('vault_theme') === 'light') document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
  
  window.__earlySwitchRequested = false;
  function handleEarlySwitch() {
    window.__earlySwitchRequested = true;
    var boot = document.getElementById('boot');
    if (boot) { boot.style.opacity = '0'; setTimeout(function(){ boot.style.display = 'none'; }, 300); }
    var root = document.getElementById('root');
    if(root) { root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;width:100%;"><div style="width:40px;height:40px;border:4px solid #12b76a;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div><p style="color:#64748b;font-weight:bold;font-family:sans-serif;">Clearing session...</p></div>'; }
    localStorage.removeItem('vault_admin_token');
    localStorage.removeItem('vault_pending_delete');
    localStorage.removeItem('vault_pending_pin_reset');
    Object.keys(localStorage).forEach(key => {
      if (key.startsWith('vault_pin_verified_')) localStorage.removeItem(key);
    });
  }
</script>

window.translateErr = (msg) => {
  if (!msg) return _t('error');
  const m = String(msg).toLowerCase();
  if (m.includes('old_pin_required') || m.includes('পুরাতন পিন প্রয়োজন')) return _t('old_pin_required');
  if (m.includes('ভুল পিন') || m.includes('incorrect') || m.includes('invalid login')) return _t('wrong_pin');
  if (m.includes('old_pin_invalid') || m.includes('পুরাতন পিন সঠিক নয়')) return _t('old_pin_err');
  if (m.includes('pin_length_err') || m.includes('৬ সংখ্যার') || m.includes('length')) return _t('pin_length_err');
  if (m.includes('mismatch') || m.includes('মিলেনি')) return _t('mismatch');
  if (m.includes('rate limit') || m.includes('exceeded')) return "Too many requests. Try again later.";
  return msg;
};

// FIX: Promise wrapper applied correctly so it doesn't fail on Supabase functions
window.withTimeout = (promise, ms, errorMsg = 'Request timed out') => {
  let timer;
  const timeoutPromise = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(errorMsg)), ms);
  });
  return Promise.race([
    Promise.resolve(promise).finally(() => clearTimeout(timer)),
    timeoutPromise
  ]);
};

const bnNum = (n) => window.lang === 'bn' ? String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]) : Number(n).toLocaleString('en-US');
const formatDate = (dateObj) => {
  if (window.lang === 'en') return `${EN_MONTHS[dateObj.getMonth()]} ${dateObj.getDate()}, ${dateObj.getFullYear()}`;
  return `${BN_MONTHS[dateObj.getMonth()]} ${bnNum(dateObj.getDate())}, ${bnNum(dateObj.getFullYear())}`;
};
const getLocalDateString = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

window.showToast = (msg, type='success') => {
  const c = document.getElementById('toast-container'); const t = document.createElement('div');
  let colors = type==='success' ? 'bg-vEmerald text-[#04150c]' : (type==='error' ? 'bg-vRose text-white' : 'bg-vIndigo text-white');
  let icon = type==='success' ? 'check-circle' : (type==='error' ? 'alert-circle' : 'loader-2');
  let spin = type==='info' ? 'animate-spin' : '';
  t.className = `toast-in flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl ${colors} text-sm font-bold max-w-xs border border-white/10`;
  t.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 shrink-0 ${spin}"></i><span>${msg}</span>`;
  c.appendChild(t); lucide.createIcons();
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(20px)'; t.style.transition='all .3s'; setTimeout(()=>t.remove(),300); }, type==='info' ? 1500 : 3200);
};

  const mc = document.getElementById('modalContainer');
  mc.classList.add('hidden'); mc.classList.remove('flex');
  if(window._emailTimerInterval) clearInterval(window._emailTimerInterval);
};

window.togglePw = (id) => {
  const el = document.getElementById(id); const icon = document.getElementById(id+'-icon');
  if(el.type === 'password'){ el.type = 'text'; icon.setAttribute('data-lucide', 'eye-off'); }
  else { el.type = 'password'; icon.setAttribute('data-lucide', 'eye'); }
  lucide.createIcons();
};

let pinResolve, pinReject, pinEntered = '';
window.askPin = async (title, subtitle='', showForgot=false) => {
  if (window._pinModalOpen) throw new Error('cancelled');
  window._pinModalOpen = true;
  await new Promise(r => setTimeout(r, 150)); 
  return new Promise((resolve, reject) => {
    pinResolve = (val) => { window._pinModalOpen = false; resolve(val); }; 
    pinReject = (err) => { window._pinModalOpen = false; reject(err); }; 
    pinEntered = '';
    const pc = document.getElementById('pinContainer');
    pc.innerHTML = `
    <div class="w-full max-w-md glass rounded-t-[36px] border-t border-x border-white/20 p-6 pb-8 pop-in relative">
      <div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-vGold/10 text-vGold rounded-full flex items-center justify-center mx-auto mb-3 border border-vGold/20"><i data-lucide="lock-keyhole" class="w-6 h-6"></i></div>
        <h3 class="disp font-bold text-xl tracking-tight">${title}</h3>
        ${subtitle ? `<p class="text-xs text-slate-500 mt-1.5">${subtitle}</p>` : ''}
      </div>
      <div class="flex justify-center gap-3 mb-8" id="pinDots">
        ${[0,1,2,3,4,5].map(i=>`<div class="dot" id="dot-${i}"></div>`).join('')}
      </div>
      <div class="grid grid-cols-3 gap-3 max-w-[260px] mx-auto">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="key-btn py-4 rounded-2xl bg-white/40 dark:bg-white/5 border border-white/50 dark:border-white/5 disp text-xl font-bold shadow-sm" onclick="window.pinKey('${n}')">${n}</button>`).join('')}
        <button type="button" class="key-btn py-4 rounded-2xl text-slate-400 font-bold text-xs hover:text-slate-600 dark:hover:text-slate-200" onclick="window.pinKey('cancel')"><i data-lucide="x" class="w-6 h-6 mx-auto"></i></button>
        <button type="button" class="key-btn py-4 rounded-2xl bg-white/40 dark:bg-white/5 border border-white/50 dark:border-white/5 disp text-xl font-bold shadow-sm" onclick="window.pinKey('0')">0</button>
        <button type="button" class="key-btn py-4 rounded-2xl text-vRose flex items-center justify-center hover:bg-vRose/10 transition-colors" onclick="window.pinKey('back')"><i data-lucide="delete" class="w-6 h-6"></i></button>
      </div>
      ${showForgot ? `<button onclick="window.forgotPin()" class="w-full text-center mt-6 text-[12px] font-bold text-slate-500 hover:text-vIndigo transition-colors">Forgot PIN? Relogin to reset.</button>` : ''}
    </div>`;
    pc.classList.remove('hidden'); lucide.createIcons();
  });
};

window.pinKey = (k) => {
  if (k === 'cancel') { document.getElementById('pinContainer').classList.add('hidden'); pinReject(new Error('cancelled')); return; }
  if (k === 'back') { pinEntered = pinEntered.slice(0,-1); }
  else if (pinEntered.length < 6) { pinEntered += k; }
  for(let i=0; i<6; i++) document.getElementById(`dot-${i}`).classList.toggle('filled', i < pinEntered.length);
  if (pinEntered.length === 6) { setTimeout(() => { document.getElementById('pinContainer').classList.add('hidden'); pinResolve(pinEntered); }, 50); }
};
window.handlePinKeydown = (e) => {
  if (document.getElementById('pinContainer').classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') window.pinKey(e.key);
  else if (e.key === 'Backspace') window.pinKey('back');
  else if (e.key === 'Escape') window.pinKey('cancel');
};
document.addEventListener('keydown', window.handlePinKeydown);

window.forgotPin = async () => {
  document.getElementById('pinContainer').classList.add('hidden');
  window.showToast(_t('forgot_pin_instruction'), 'info');
  if (window.session?.user?.id) {
    localStorage.setItem('vault_pending_pin_reset', window.session.user.id);
  }
  await window.switchAccount();
};

window.callApi = async (path, body) => {
  const res = await window.withTimeout(fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) }), 8000);
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || 'Server Error');
  return json;
};
window.notify = (event, details) => { if (window.session) window.callApi('/api/notify', { event, accessToken: window.session.access_token, details }).catch(()=>{}); };

function currentRedirectUrl() { return window.location.origin + window.location.pathname; }

window.loginProvider = async (provider) => { window.showToast('Redirecting...', 'info'); await window.supa.auth.signInWithOAuth({ provider, options: { redirectTo: currentRedirectUrl() } }); };
window.loginEmail = async () => {
  const e = document.getElementById('auth-email').value; const p = document.getElementById('auth-pw').value;
  if(!e || !p) return window.showToast('Fill all fields', 'error');
  window.showToast(_t('logging_in'), 'info');
  const { error } = await window.supa.auth.signInWithPassword({ email: e, password: p });
  if(error) window.showToast(translateErr(error.message), 'error'); else window.showToast(_t('login_success'));
};

window.startRegTimer = () => {
  if(window._regTimer) clearInterval(window._regTimer);
  window._regTimerLeft = 60;
  window._regTimer = setInterval(() => {
    window._regTimerLeft--;
    const btn = document.getElementById('resend-reg-btn');
    if(btn) {
      if(window._regTimerLeft <= 0) {
        clearInterval(window._regTimer);
        btn.disabled = false; btn.innerText = 'Resend Code';
        btn.classList.add('text-vEmerald'); btn.classList.remove('text-slate-400');
      } else {
        btn.disabled = true; btn.innerText = `Resend in ${window._regTimerLeft}s`;
        btn.classList.remove('text-vEmerald'); btn.classList.add('text-slate-400');
      }
    }
  }, 1000);
};

window.startReg = async (isResend = false) => {
  const e = document.getElementById('reg-email').value;
  if(!e) return window.showToast('Enter email address', 'error');
  window.showToast(isResend ? 'Resending Code...' : 'Sending Verification Code...', 'info');
  const { error } = await window.supa.auth.signInWithOtp({ email: e, options: { shouldCreateUser: true } });
  if(error) return window.showToast(translateErr(error.message), 'error');
  window.regState.email = e; window.regState.step = 2; window.showToast('Code sent to email', 'success'); window.render(); window.startRegTimer();
};

window.verifyRegOtp = async () => {
  const otp = document.getElementById('reg-otp').value;
  if(!otp) return window.showToast('Enter OTP', 'error');
  window.showToast(_t('verifying'), 'info');
  const { error } = await window.supa.auth.verifyOtp({ email: window.regState.email, token: otp, type: 'email' });
  if(error) return window.showToast(translateErr(error.message), 'error');
  if(window._regTimer) clearInterval(window._regTimer);
  window.regState.step = 3; window.showToast('Verified! Set a password'); window.render();
};

window.setRegPassword = async () => {
  const p1 = document.getElementById('reg-pw1').value; const p2 = document.getElementById('reg-pw2').value;
  if(!p1 || p1.length < 6) return window.showToast('Password min 6 chars', 'error');
  if(p1 !== p2) return window.showToast('Passwords do not match', 'error');
  window.showToast('Saving...', 'info');
  const { error } = await window.supa.auth.updateUser({ password: p1 });
  if(error) return window.showToast(translateErr(error.message), 'error');
  window.regState = { step: 1, email: '', otp: '', password: '' };
  window.showToast('Account Created Successfully!'); window.render();
};

window._switchingAccount = false;
window.switchAccount = async () => {
  if (window._switchingAccount) return;
  window._switchingAccount = true;
  window._pinFlowActive = false;
  window._pinModalOpen = false;
  const pinContainer = document.getElementById('pinContainer');
  if (pinContainer) pinContainer.classList.add('hidden');

  window.session = null; window.profile = null; window.txns = []; window._pinVerified = false; window.isTxnLoading = false; window.authMode = 'login';
  localStorage.removeItem('vault_admin_token'); localStorage.removeItem('vault_pending_delete');
  
  hideBoot();
  const root = document.getElementById('root');
  if (root) root.innerHTML = `<div class="p-10 text-center w-full mt-20 fade-in"><div class="w-10 h-10 border-4 border-vEmerald border-t-transparent rounded-full animate-spin mx-auto mb-4"></div><p class="font-bold text-slate-500">${_t('logging_out')}</p></div>`;

  try { if (window.supa) await window.withTimeout(window.supa.auth.signOut({ scope: 'local' }), 3000, 'Sign out timed out'); } catch (e) {}
  
  if (typeof window.ultimateTimeout !== 'undefined') clearTimeout(window.ultimateTimeout);
  window._switchingAccount = false;
  window.render();
};
window.logout = window.switchAccount;
window.exitAdmin = () => { window.adminToken = null; localStorage.removeItem('vault_admin_token'); window.changeTab('dashboard'); };

window.loadProfile = async () => {
  const session = window.session;
  if (!session?.user?.id) return false;
  const userId = session.user.id;
  
  try {
    const { data, error } = await window.withTimeout(
      window.supa.from('profiles').select('*').eq('id', userId).maybeSingle(),
      5000, 'Profile request timed out'
    );
    if (error) throw error;
    if (data) {
      if (window.session?.user?.id === userId) window.profile = data;
      return true;
    }
    const st = await window.callApi('/api/pin', { action: 'status', accessToken: session.access_token }).catch(()=>({pin_set:false, is_suspended:false}));
    window.profile = { id: userId, full_name: session.user.user_metadata?.full_name || session.user.user_metadata?.name || 'User', email: session.user.email || '', avatar_url: session.user.user_metadata?.avatar_url || '', pin_set: st.pin_set, is_suspended: st.is_suspended, suspend_reason: null };
    return true;
  } catch(e) { 
    const st = await window.callApi('/api/pin', { action: 'status', accessToken: session.access_token }).catch(()=>({pin_set:false, is_suspended:false}));
    window.profile = { id: userId, full_name: session.user.user_metadata?.full_name || 'User', email: session.user.email || '', avatar_url: session.user.user_metadata?.avatar_url || '', pin_set: st.pin_set, is_suspended: st.is_suspended, suspend_reason: null };
    return true; 
  }
};

window.loadTxns = async (silent = false) => {
  const userId = window.session?.user?.id;
  if (!userId) return false;
  window.isTxnLoading = true;
  if (window.session) window.render();

  try {
    const { data, error } = await window.withTimeout(
      window.supa.from('transactions').select('*').eq('user_id', userId).order('txn_date', { ascending: false }).order('created_at', { ascending: false }),
      15000, 'Transaction loading timed out'
    );
    if (error) throw error;
    if ( !window.session || window.session.user.id !== userId ) return false;
    window.txns = data || [];
    return true;
  } catch (e) {
    if (!silent && window.session) window.showToast(translateErr(e.message), 'error');
    return false;
  } finally {
    window.isTxnLoading = false;
    if ( window.session && window.session.user.id === userId ) window.render();
  }
};

  if (window.profile && window.profile.is_suspended) { root.innerHTML = buildSuspended(); lucide.createIcons(); return; }

window.handleLogoTap = () => {
  const adminEmail = window.CFG?.superAdminEmail?.toLowerCase().trim();
  const userEmail = window.profile?.email?.toLowerCase().trim();
  if (!adminEmail || !userEmail || adminEmail !== userEmail) return;
  window.logoTapCount++; 
  if (window.logoTapCount >= 5) { window.logoTapCount = 0; window.openMasterKeyModal(); }
  setTimeout(()=>{ window.logoTapCount = 0; }, 2500);
};

function updateNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    const on = b.dataset.tab === window.activeTab;
    if(on){
      b.classList.add('text-vEmerald', 'bg-slate-200/60', 'dark:bg-white/10', 'rounded-xl');
      b.classList.remove('text-slate-400');
    }else{
      b.classList.remove('text-vEmerald', 'bg-slate-200/60', 'dark:bg-white/10', 'rounded-xl');
      b.classList.add('text-slate-400');
    }
  });
  const htmlDark = document.documentElement.classList.contains('dark');
  document.querySelectorAll('.themeSlider').forEach(el => {
    if(el.parentElement.classList.contains('hidden')){ el.classList.toggle('translate-x-[24px]', htmlDark); } 
    else { el.classList.toggle('translate-x-[26px]', htmlDark); }
  });
}
window.changeTab = (tab) => { if (tab === 'manage' && !window.adminToken) return; window.activeTab = tab; localStorage.setItem('vault_tab', tab); window.render(); };
window.toggleTheme = () => { const html = document.documentElement; html.classList.toggle('dark'); localStorage.setItem('vault_theme', html.classList.contains('dark') ? 'dark' : 'light'); updateNav(); };

function buildTabContent(){
  if (window.activeTab === 'dashboard') return buildDashboard();
  if (window.activeTab === 'add') return buildAdd();
  if (window.activeTab === 'history') return buildHistory();
  if (window.activeTab === 'profile') return buildProfile();
  if (window.activeTab === 'manage' && window.adminToken) return buildManage();
  return buildDashboard();
}

function buildDashboard(){
  const p = window.profile || {};
  const income = window.txns.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const expense = window.txns.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const balance = income - expense;
  const now = new Date(); const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const left = daysInMonth - now.getDate(); const pct = left / daysInMonth;
  const r = 42, circ = 2*Math.PI*r; const offset = circ * (1 - pct);
  let progColor = '#12b76a'; if(pct < 0.25) progColor = '#f2495c'; else if(pct < 0.5) progColor = '#f97316'; else if(pct < 0.75) progColor = '#f2b705';

  return `
  <div class="cut glass p-6 md:p-8 relative overflow-hidden mb-6 shadow-sm mt-2">
    <div class="flex justify-between items-center gap-6">
      <div>
        <p class="text-vEmerald font-bold text-[10px] uppercase tracking-[0.2em] mb-1.5 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-vEmerald animate-pulse shadow-[0_0_8px_#12b76a]"></span> ${window.lang==='en'?EN_DAYS[now.getDay()]:BN_DAYS[now.getDay()]}</p>
        <h2 class="disp text-[26px] md:text-3xl font-extrabold mb-1 tracking-tight">${formatDate(now)}</h2>
        <p class="text-[13px] text-slate-500 font-medium">${_t('welcome')}, ${p.full_name?.split(' ')[0]||'User'}</p>
      </div>
      <svg width="100" height="100" viewBox="0 0 100 100" class="-rotate-90 shrink-0 drop-shadow-md">
        <circle cx="50" cy="50" r="${r}" fill="none" stroke-width="8" class="ring-track"></circle>
        <circle cx="50" cy="50" r="${r}" fill="none" stroke-width="8" class="ring-prog" stroke="${progColor}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"></circle>
        <text x="50" y="46" text-anchor="middle" fill="currentColor" font-size="22" font-weight="800" transform="rotate(90 50 50)" font-family="Sora">${bnNum(left)}</text>
        <text x="50" y="63" text-anchor="middle" fill="currentColor" opacity="0.6" font-size="9" transform="rotate(90 50 50)">${_t('days_left')}</text>
      </svg>
    </div>
  </div>
  <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4 mb-6">
    ${statCard(_t('total_in'), '৳ '+bnNum(income), 'arrow-down-circle', 'from-vEmerald to-emerald-700', ()=>window.changeTab('add'))}
    ${statCard(_t('total_out'), '৳ '+bnNum(expense), 'arrow-up-circle', 'from-vRose to-rose-700', ()=>window.changeTab('add'))}
    <div class="col-span-2 md:col-span-1 cut bg-gradient-to-br from-vGold to-amber-600 p-5 relative overflow-hidden shadow-md border border-white/20 cursor-pointer transition-transform active:scale-[0.98]" onclick="window.changeTab('history')">
      <i data-lucide="wallet" class="absolute -right-3 -bottom-3 w-24 h-24 text-white/20"></i>
      <span class="text-[10px] font-bold uppercase tracking-widest text-white/90 block mb-1 drop-shadow-sm">${_t('balance')}</span>
      <h3 class="text-2xl md:text-3xl font-extrabold disp text-white relative z-10 drop-shadow-sm tracking-tight">৳ ${bnNum(balance)}</h3>
    </div>
  </div>
  <div class="glass rounded-[24px] overflow-hidden shadow-sm">
    <div class="p-4 border-b border-white/20 dark:border-white/5 flex items-center justify-between bg-white/20 dark:bg-black/20">
      <div class="flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4 text-vEmerald"></i><h3 class="font-bold disp text-sm">${_t('recent')}</h3></div>
      <button type="button" onclick="window.changeTab('history')" class="text-[11px] font-bold text-vEmerald hover:underline">${_t('see_all')}</button>
    </div>
    <div class="divide-y divide-slate-100/50 dark:divide-white/5">
      ${window.isTxnLoading && window.txns.length === 0 
        ? `<div class="p-10 text-center text-slate-500 text-sm font-medium"><i data-lucide="loader-2" class="w-5 h-5 animate-spin mx-auto mb-2"></i>${_t('loading_data')}</div>` 
        : (window.txns.slice(0,5).map(txnRow).join('') || `<div class="p-10 text-center text-slate-500 text-sm font-medium">${_t('no_txns')}</div>`)}
    </div>
  </div>`;
}

function statCard(label, value, icon, grad, onClick){
  return `<div onclick="(${onClick.toString()})()" class="cut bg-gradient-to-br ${grad} p-5 relative overflow-hidden shadow-md border border-white/20 cursor-pointer transition-transform active:scale-[0.98]">

}

window.deleteTxn = async (id) => {

    window.showToast(_t('verifying'), 'info');

  } catch(e) { if(e.message !== 'cancelled') window.showToast(translateErr(e.message), 'error'); }

window.bulkDeleteTxn = async (type) => {
  try {
    const pin1 = await window.askPin(_t('del_confirm_1'), _t('enter_pin_cont')); 
    const pin2 = await window.askPin(_t('del_confirm_2'), _t('enter_pin_perm'));
    if(pin1 !== pin2) { window.showToast(_t('mismatch'), 'error'); return; }
    window.showToast(_t('verifying'), 'info');

    let query = window.supa.from('transactions').delete().eq('user_id', window.session.user.id); if (type !== 'all') query = query.eq('type', type);
    await query; window.showToast(_t('deleted')); await window.loadTxns(); window.render();

window.sendEmailCode = async () => {
  const newEmail = document.getElementById('modal-email-input').value;
  if(!newEmail || newEmail.trim() === '' || newEmail === window.profile.email) return window.showToast('Enter a valid new email', 'error');
  
  const btn = document.getElementById('modal-email-send-btn');
  btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin mx-auto"></i>'; lucide.createIcons();
  
  const { error } = await window.supa.auth.updateUser({ email: newEmail });
  if(error) { btn.disabled = false; btn.innerHTML = 'Send Code'; return window.showToast(translateErr(error.message), 'error'); }
  
  window.showToast('Code sent to new email!', 'success');
  document.getElementById('modal-email-input').disabled = true;
  document.getElementById('modal-email-otp-box').classList.remove('hidden');
  document.getElementById('modal-email-otp-box').classList.add('flex');
  
  let timeLeft = 60;
  btn.classList.replace('bg-vIndigo', 'bg-slate-300'); btn.classList.add('dark:bg-slate-700', 'text-slate-500');
  
  window._emailTimerInterval = setInterval(() => {
    timeLeft--;
    if(timeLeft <= 0) {
      clearInterval(window._emailTimerInterval);
      btn.disabled = false; btn.innerHTML = 'Resend Code';
      btn.classList.replace('bg-slate-300', 'bg-vIndigo'); btn.classList.remove('dark:bg-slate-700', 'text-slate-500');

};

// FIX: Prevent PIN setup if already exists & Auto save state to LocalStorage
window.forceSetPin = async (isReset = false) => {
  if (window._pinFlowActive) return;
  // If not resetting and pin is already set, abort UI popup and save state.
  if (!isReset && window.profile?.pin_set) { 
    window._pinVerified = true; 
    localStorage.setItem('vault_pin_verified_' + window.session.user.id, 'true');
    window.render(); 
    return; 
  } 
  
  window._pinFlowActive = true;
  try {
    const p1 = await window.askPin(_t('setup_security_pin'), _t('setup_pin_description'));
    if (!p1) return;
    const p2 = await window.askPin(_t('confirm_pin'), _t('confirm_pin_desc'));
    if (!p2) return;
    
    if (p1 !== p2) { window.showToast(_t('mismatch'), 'error'); return; }
    
    window.showToast(_t('setting_pin'), 'info');
    await window.callApi('/api/pin', { action: isReset ? 'reset' : 'set', pin: p1, accessToken: window.session.access_token });
    
    if(window.profile) window.profile.pin_set = true;
    window._pinVerified = true;
    localStorage.setItem('vault_pin_verified_' + window.session.user.id, 'true');
    window.showToast(_t('pin_set_success'), 'success');
    window.render();
  } catch(e) { 
    // Fallback: If DB already has the PIN but client missed it, seamlessly switch UI
    if (e.message && e.message.includes('PIN already exists')) {
      if (window.profile) window.profile.pin_set = true;
      window.showToast('PIN exists! Switching to unlock vault...', 'info');
      window.render();
    } else if (e.message !== 'cancelled') {
      window.showToast(translateErr(e.message), 'error');

};

let cropState = { img: null, scale: 1, dx: 0, dy: 0, dragging: false, px: 0, py: 0, file: null, pointers: [], initDist: 0, initScale: 1 };
window.initCropper = (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  if (file.size > 10*1024*1024) return window.showToast('Max size 10MB', 'error');
  
  cropState.file = file; const reader = new FileReader();
  const modal = document.getElementById('cropperModal');
  modal.classList.remove('hidden'); modal.classList.add('flex'); modal.style.opacity = '0';
  
  reader.onload = (ev) => {
    const img = document.getElementById('cropperImg'); cropState.img = img;
    img.onload = () => {
      setTimeout(() => {
        const area = document.getElementById('cropperArea'); const boxSize = 280;
        cropState.scale = Math.max(boxSize / img.naturalWidth, boxSize / img.naturalHeight);
        const zoom = document.getElementById('cropZoom');
        zoom.min = cropState.scale; zoom.max = cropState.scale * 3; zoom.step = 0.01; zoom.value = cropState.scale;
        cropState.dx = (area.clientWidth - (img.naturalWidth * cropState.scale)) / 2; cropState.dy = (area.clientHeight - (img.naturalHeight * cropState.scale)) / 2;
        applyBounds(); updateCropView(); modal.style.opacity = '1';
      }, 50); 
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

function updateCropView(){ cropState.img.style.transform = `translate(${cropState.dx}px, ${cropState.dy}px) scale(${cropState.scale})`; }
function applyBounds() {
  const minScale = Math.max(280 / cropState.img.naturalWidth, 280 / cropState.img.naturalHeight);
  if (cropState.scale < minScale) cropState.scale = minScale;
  const area = document.getElementById('cropperArea');
  const cx = area.clientWidth / 2; const cy = area.clientHeight / 2;
  const maxDx = cx - 140; const minDx = cx + 140 - (cropState.img.naturalWidth * cropState.scale);
  const maxDy = cy - 140; const minDy = cy + 140 - (cropState.img.naturalHeight * cropState.scale);
  if (cropState.dx > maxDx) cropState.dx = maxDx; if (cropState.dx < minDx) cropState.dx = minDx;
  if (cropState.dy > maxDy) cropState.dy = maxDy; if (cropState.dy < minDy) cropState.dy = minDy;
}

document.getElementById('cropZoom').addEventListener('input', e => {
  const oldScale = cropState.scale; cropState.scale = parseFloat(e.target.value);
  const area = document.getElementById('cropperArea');
  const cx = area.clientWidth / 2; const cy = area.clientHeight / 2;
  cropState.dx = cx - (cx - cropState.dx) * (cropState.scale / oldScale); cropState.dy = cy - (cy - cropState.dy) * (cropState.scale / oldScale);
  applyBounds(); updateCropView();
});

const cArea = document.getElementById('cropperArea');
cArea.addEventListener('pointerdown', e => { 
  cropState.pointers.push(e);
  if (cropState.pointers.length === 2) { cropState.initDist = Math.hypot(cropState.pointers[0].clientX - cropState.pointers[1].clientX, cropState.pointers[0].clientY - cropState.pointers[1].clientY); cropState.initScale = cropState.scale; } 
  else if (cropState.pointers.length === 1) { cropState.dragging = true; cropState.px = e.clientX; cropState.py = e.clientY; cArea.setPointerCapture(e.pointerId); }
});
cArea.addEventListener('pointermove', e => {
  const index = cropState.pointers.findIndex(p => p.pointerId === e.pointerId); if (index !== -1) cropState.pointers[index] = e;
  if (cropState.pointers.length === 2) {
    const dist = Math.hypot(cropState.pointers[0].clientX - cropState.pointers[1].clientX, cropState.pointers[0].clientY - cropState.pointers[1].clientY);
    const zoomFactor = dist / cropState.initDist; const oldScale = cropState.scale; let newScale = cropState.initScale * zoomFactor;
    const minScale = Math.max(280 / cropState.img.naturalWidth, 280 / cropState.img.naturalHeight);
    if(newScale < minScale) newScale = minScale; cropState.scale = newScale;
    const cx = cArea.clientWidth / 2; const cy = cArea.clientHeight / 2;
    cropState.dx = cx - (cx - cropState.dx) * (cropState.scale / oldScale); cropState.dy = cy - (cy - cropState.dy) * (cropState.scale / oldScale);
    applyBounds(); updateCropView(); document.getElementById('cropZoom').value = cropState.scale;
  } else if (cropState.dragging && cropState.pointers.length === 1) {
    cropState.dx += (e.clientX - cropState.px); cropState.dy += (e.clientY - cropState.py); cropState.px = e.clientX; cropState.py = e.clientY; applyBounds(); updateCropView();
  }
});
const handlePointerUp = e => {
  cropState.pointers = cropState.pointers.filter(p => p.pointerId !== e.pointerId);
  if (cropState.pointers.length < 2 && cropState.pointers.length === 1) { cropState.px = cropState.pointers[0].clientX; cropState.py = cropState.pointers[0].clientY; }
  if(cropState.pointers.length === 0) { cropState.dragging = false; cArea.releasePointerCapture(e.pointerId); }
};
cArea.addEventListener('pointerup', handlePointerUp); cArea.addEventListener('pointercancel', handlePointerUp);
window.closeCropper = () => { document.getElementById('cropperModal').classList.add('hidden'); document.getElementById('cropperModal').classList.remove('flex'); };
window.doCrop = () => {
  const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512; const ctx = canvas.getContext('2d'); const area = document.getElementById('cropperArea');
  const sX = ((area.clientWidth/2 - 140) - cropState.dx) / cropState.scale; const sY = ((area.clientHeight/2 - 140) - cropState.dy) / cropState.scale;
  const sW = 280 / cropState.scale; const sH = 280 / cropState.scale; ctx.drawImage(cropState.img, sX, sY, sW, sH, 0, 0, 512, 512);
  canvas.toBlob(async (blob) => {
    window.closeCropper(); window.showToast('Uploading...', 'info');
    try {
      const path = `${window.session.user.id}/avatar_${Date.now()}.jpg`;
      const { error: upErr } = await window.supa.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
      if (upErr) throw upErr;
      const { data: pub } = window.supa.storage.from('avatars').getPublicUrl(path);
      const { error: profErr } = await window.supa.from('profiles').update({ avatar_url: pub.publicUrl }).eq('id', window.session.user.id);
      if (profErr) throw profErr;
      await window.loadProfile(); window.render(); window.showToast('Avatar updated!');
    } catch(err){ window.showToast(translateErr(err.message), 'error'); }
  }, 'image/jpeg', 0.9);
};

function hideBoot() {
  const bootEl = document.getElementById('boot');
  if (bootEl && !bootEl.classList.contains('boot-hide')) {
    bootEl.classList.add('boot-hide');
    setTimeout(()=>bootEl.remove(), 400);
  }
}

async function boot() {
  const bootRetryBtn = document.getElementById('bootRetryBtn');
  const bootStatusText = document.getElementById('bootStatusText');
  let bootFinished = false;

  const finishBoot = () => {
    if (bootFinished) return;
    bootFinished = true;
    clearTimeout(window.ultimateTimeout);
    hideBoot();
    window.render();
  };

  const handleSession = async (session) => {
    if (bootFinished) return;

    if (window.__earlySwitchRequested) {
      window.__earlySwitchRequested = false;
      window.session = null;
      window.profile = null;
      window.txns = [];
      window._pinVerified = false;
      try { if (window.supa) await window.supa.auth.signOut({ scope: 'local' }); } catch (e) {}
      window.authMode = 'login';
      finishBoot();
      return;
    }

    if (!session) {
      window.session = null;
      window.profile = null;
      window.txns = [];
      finishBoot();
      return;
    }

    // Initialize session & checking remembered PIN status
    window.session = session;
    window._pinVerified = localStorage.getItem('vault_pin_verified_' + session.user.id) === 'true';
    
    const pendingDelId = localStorage.getItem('vault_pending_delete');
    if (pendingDelId && session.user.id === pendingDelId) {
      localStorage.removeItem('vault_pending_delete');
      try { await window.callApi('/api/pin', { action: 'delete_account', accessToken: session.access_token }); } catch (e) {}
      try { await window.supa.auth.signOut({ scope: 'local' }); } catch (e) {}
      window.session = null; window.profile = null; window.txns = []; window._pinVerified = false;
      finishBoot(); return;
    }

    // Load profile
    await window.loadProfile();
    
    // Check if user requested a PIN reset previously
    const pendingResetId = localStorage.getItem('vault_pending_pin_reset');
    if (pendingResetId && session.user.id === pendingResetId) {
      localStorage.removeItem('vault_pending_pin_reset');
      localStorage.removeItem('vault_pin_verified_' + session.user.id); // clear verify state
      
      if (bootFinished) return;
      if (window.location.hash || window.location.search) { window.history.replaceState(null, '', window.location.pathname); }
      
      window._pinVerified = false;
      if (window.profile) window.profile.pin_set = false; // Trick frontend to go to lock screen
      finishBoot();
      setTimeout(() => window.forceSetPin(true), 300); // the `true` flag tells api/pin to use "action: reset"
      return;
    }

    if (bootFinished) return;

    if (window.location.hash || window.location.search) {
      window.history.replaceState(null, '', window.location.pathname);
    }

    finishBoot();
    
    // Background Loading
    window.loadTxns(true);
  };

  try {
    if (bootStatusText) bootStatusText.innerText = 'Connecting';
    
    window.ultimateTimeout = setTimeout(() => {
      if (bootStatusText) bootStatusText.innerText = 'Taking longer than usual...';
      if (bootRetryBtn) bootRetryBtn.classList.remove('hidden');
    }, 6000); 

    const cfgRes = await window.withTimeout(fetch('/api/config', { cache: 'no-store' }), 6000, 'Config fetch timeout');
    if (!cfgRes.ok) throw new Error(`Config HTTP ${cfgRes.status}`);
    window.CFG = await cfgRes.json();
    
    if (!window.CFG.supabaseUrl || !window.CFG.supabaseAnonKey) {
       throw new Error('Supabase Config Missing in Vercel');
    }

    window.supa = createClient(window.CFG.supabaseUrl, window.CFG.supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    if (bootStatusText) bootStatusText.innerText = 'Checking session';

    window.supa.auth.onAuthStateChange((event, session) => {
      setTimeout(() => { handleSession(session); }, 0);
    });

    const { data: { session }, error: sessionError } = await window.withTimeout(
      window.supa.auth.getSession(), 6000, 'Session check timeout'
    );
    
    if(sessionError) throw sessionError;

    if (!bootFinished) {
      await handleSession(session);
    }

  } catch (e) {
    console.error('BOOT FAILED:', e);
    if (bootFinished) return;
    
    clearTimeout(window.ultimateTimeout);
    hideBoot();
    document.getElementById('root').innerHTML = `
      <div class="flex-1 flex flex-col items-center justify-center text-center px-6">
        <div class="text-4xl mb-4">⚠️</div>
        <h2 class="font-bold text-lg mb-2">Vault couldn't start</h2>
        <p class="text-[13px] text-rose-500 font-mono font-medium mb-3 bg-rose-500/10 px-3 py-1.5 rounded-xl border border-rose-500/20">${e.message || 'Unknown network error'}</p>
        <p class="text-xs text-slate-500 mb-6 max-w-xs">If you see "Config HTTP 500" or "Supabase Config Missing", check your Vercel Environment Variables.</p>
        <div class="flex gap-3 justify-center w-full max-w-xs">
          <button onclick="window.location.reload()" class="flex-1 py-3 bg-vEmerald text-[#04150c] rounded-xl font-bold shadow-sm active:scale-95">Retry</button>
          <button onclick="handleEarlySwitch(); setTimeout(()=>window.location.reload(), 500)" class="flex-1 py-3 bg-slate-200 dark:bg-white/10 rounded-xl font-bold shadow-sm active:scale-95 text-[12px]">Clear Cache</button>
        </div>
      </div>`;
  }
}
