  darkMode: 'class',

    fontFamily: { display: ['"Sora"','sans-serif'], body: ['"Inter"','sans-serif'], mono: ['"JetBrains Mono"','monospace'] },

<style>
  * { -webkit-tap-highlight-color: transparent; }
  html,body { background:#f1f5f9; min-height:100dvh; display:flex; flex-direction:column; transition: background .4s ease; }
  html.dark, html.dark body { background:#0a0a0a; }
  body { font-family:'Inter',sans-serif; }
  .disp { font-family:'Sora',sans-serif; letter-spacing:-0.01em; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .hide-scrollbar::-webkit-scrollbar{display:none} .hide-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  
  /* Advanced Glassmorphism Styles */
  .glass { background:rgba(255,255,255,0.65); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.7); box-shadow: 0 8px 32px rgba(0,0,0,0.04); }
  .dark .glass { background:rgba(20,20,20,0.45); border:1px solid rgba(255,255,255,0.06); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  
  .glass-input { background:rgba(255,255,255,0.5); backdrop-filter:blur(12px); border:1px solid rgba(0,0,0,0.05); }
  .dark .glass-input { background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.05); }

  .cut{ clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px) }
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .fade-in{animation:fadeIn .4s cubic-bezier(.16,1,.3,1) forwards} @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .pop-in{animation:popIn .35s cubic-bezier(.16,1,.3,1) forwards} @keyframes popIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  .toast-in{animation:toastIn .3s ease-out forwards} @keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:translateX(0)}}
  #boot{transition:opacity .4s ease,visibility .4s ease} .boot-hide{opacity:0;visibility:hidden;pointer-events:none}
  ::selection{background:#12b76a;color:#04150c}
  .ring-track{stroke:rgba(255,255,255,.08)} .dark .ring-track{stroke:rgba(255,255,255,.08)} .ring-prog{stroke:#f2b705;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.16,1,.3,1)}
  .key-btn{transition:transform .12s ease,background .12s ease} .key-btn:active{transform:scale(.92)}
  .dot{width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.1);transition:all .2s ease}
  .dark .dot{background:rgba(255,255,255,.12)}
  .dot.filled{background:#12b76a;box-shadow:0 0 12px rgba(18,183,106,.6)}
</style>
</head>
<body class="text-slate-900 dark:text-slate-100 flex flex-col h-full w-full">

<!-- Cropper Modal -->
<div id="cropperModal" class="fixed inset-0 bg-black/95 z-[999] hidden flex-col touch-none">

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm';

/* ---------------- i18n Dictionary ---------------- */
window.lang = localStorage.getItem('vault_lang') || 'en';
const LANG = {
  bn: {
    tagline: "আপনার ব্যক্তিগত আয়-ব্যয়ের সম্পূর্ণ গোপনীয় হিসাব। একদম নিরাপদ।",
    login_btn: "গুগল দিয়ে লগইন করুন", auto_save: "লগইন করলেই আপনার নাম, ইমেইল ও ছবি সেভ হবে।",
    dashboard: "হোম", add: "এন্ট্রি", history: "হিস্ট্রি", manage: "ম্যানেজ", profile: "প্রোফাইল",
    welcome: "স্বাগতম", days_left: "দিন বাকি",
    total_in: "মোট আয়", total_out: "মোট ব্যয়", balance: "ফান্ডে আছে",
    recent: "সাম্প্রতিক লেনদেন", see_all: "সব দেখুন", no_txns: "এখনো কোনো এন্ট্রি নেই।",
    new_entry: "নতুন এন্ট্রি", income: "আয়", expense: "ব্যয়",
    amount_label: "পরিমাণ (৳)", where_label: "কোথায় আয়/ব্যয় হয়েছে?", note_label: "নোট (ঐচ্ছিক)", date_label: "তারিখ", save: "সেভ করুন",
    history_title: "সম্পূর্ণ হিস্ট্রি", search: "খুঁজুন...", all: "সব", del: "মুছুন",
    sec_pin: "নিরাপত্তা পিন", change_pin: "পিন পরিবর্তন করুন",
    feedback: "ডেভেলপার ফিডব্যাক", dev_contact: "যোগাযোগ করুন",
    danger: "বিপদজনক অঞ্চল", reset_all: "সম্পূর্ণ হিস্ট্রি রিসেট করুন", delete_account: "অ্যাকাউন্ট ও ডেটা ডিলিট করুন",
    logout: "লগআউট", lang_switch: "Switch to English", exit_admin: "অ্যাডমিন প্যানেল থেকে প্রস্থান",
    save_success: "এন্ট্রি সেভ হয়েছে!", req_fields: "পরিমাণ ও উৎস দিন"
  },
  en: {
    tagline: "Your completely private income-expense tracker. 100% secure.",
    login_btn: "Login with Google", auto_save: "Your info and avatar will be saved securely.",
    dashboard: "Home", add: "Entry", history: "History", manage: "Manage", profile: "Profile",
    welcome: "Welcome", days_left: "Days Left",
    total_in: "Total Income", total_out: "Total Expense", balance: "Balance",
    recent: "Recent Transactions", see_all: "See All", no_txns: "No entries yet.",
    new_entry: "New Entry", income: "Income", expense: "Expense",
    amount_label: "Amount (৳)", where_label: "Source / Destination?", note_label: "Note (Optional)", date_label: "Date", save: "Save Entry",
    history_title: "Full History", search: "Search...", all: "All", del: "Delete",
    sec_pin: "Security PIN", change_pin: "Change PIN",
    feedback: "Developer Feedback", dev_contact: "Contact Developer",
    danger: "Danger Zone", reset_all: "Reset Full History", delete_account: "Delete Account & Data",
    logout: "Logout", lang_switch: "Switch to Bengali", exit_admin: "Exit Admin Mode",
    save_success: "Entry saved!", req_fields: "Amount and Source required"
  }
};
window._t = (key) => LANG[window.lang][key] || key;

/* ---------------- state ---------------- */
window.supa = null; window.session = null; window.profile = null;
window.adminToken = localStorage.getItem('vault_admin_token') || null;
window.activeTab = localStorage.getItem('vault_tab') || 'dashboard';
window.txns = []; window.feedbackList = []; window.CFG = {}; window.logoTapCount = 0;

const BN_DAYS = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const EN_DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const EN_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const refId = () => Math.random().toString(36).substr(2,6).toUpperCase();
const bnNum = (n) => window.lang === 'bn' ? String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]) : Number(n).toLocaleString('en-US');
const formatDate = (dateObj) => {
  if (window.lang === 'en') return `${EN_MONTHS[dateObj.getMonth()]} ${dateObj.getDate()}, ${dateObj.getFullYear()}`;
  return `${BN_MONTHS[dateObj.getMonth()]} ${bnNum(dateObj.getDate())}, ${bnNum(dateObj.getFullYear())}`;
};

/* ---------------- toast / modal ---------------- */
window.showToast = (msg, type='success') => {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  const colors = type==='success' ? 'bg-vEmerald text-[#04150c]' : (type==='error' ? 'bg-vRose text-white' : 'bg-slate-800 text-white');
  t.className = `toast-in flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl ${colors} text-sm font-bold max-w-xs border border-white/10`;
  t.innerHTML = `<i data-lucide="${type==='success'?'check-circle':'alert-circle'}" class="w-5 h-5 shrink-0"></i><span>${msg}</span>`;
  c.appendChild(t); lucide.createIcons();
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(20px)'; t.style.transition='all .3s'; setTimeout(()=>t.remove(),300); }, 3200);
};

window.showModal = (html) => {
  const mc = document.getElementById('modalContainer');
  mc.innerHTML = `<div class="glass w-full max-w-sm rounded-3xl p-6 border pop-in shadow-2xl relative my-auto max-h-[85vh] overflow-y-auto hide-scrollbar">${html}</div>`;
  mc.classList.remove('hidden'); lucide.createIcons();
  mc.onclick = (e)=>{ if(e.target===mc) window.hideModal(); };
};
window.hideModal = () => document.getElementById('modalContainer').classList.add('hidden');

/* ---------------- floating PIN keypad (Always English & Keyboard Support) ---------------- */
let pinResolve, pinReject, pinEntered = '';
window.askPin = (title, subtitle='') => {
  return new Promise((resolve, reject) => {
    pinResolve = resolve; pinReject = reject; pinEntered = '';
    const pc = document.getElementById('pinContainer');
    pc.innerHTML = `
    <div class="w-full max-w-md glass rounded-t-[36px] border-t border-x border-white/20 p-6 pb-8 pop-in">
      <div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-vGold/10 text-vGold rounded-full flex items-center justify-center mx-auto mb-3 border border-vGold/20"><i data-lucide="lock-keyhole" class="w-6 h-6"></i></div>
        <h3 class="disp font-bold text-xl tracking-tight">${title}</h3>
        ${subtitle ? `<p class="text-xs text-slate-500 mt-1.5">${subtitle}</p>` : ''}
      </div>
      <div class="flex justify-center gap-3 mb-8" id="pinDots">
        ${[0,1,2,3,4,5].map(i=>`<div class="dot" id="dot-${i}"></div>`).join('')}
      </div>
      <div class="grid grid-cols-3 gap-3 max-w-[260px] mx-auto">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="key-btn py-4 rounded-2xl bg-white/40 dark:bg-white/5 border border-white/50 dark:border-white/5 disp text-xl font-bold shadow-sm" onclick="window.pinKey('${n}')">${n}</button>`).join('')}
        <button type="button" class="key-btn py-4 rounded-2xl text-slate-400 font-bold text-xs hover:text-slate-600 dark:hover:text-slate-200" onclick="window.pinKey('cancel')"><i data-lucide="x" class="w-6 h-6 mx-auto"></i></button>
        <button type="button" class="key-btn py-4 rounded-2xl bg-white/40 dark:bg-white/5 border border-white/50 dark:border-white/5 disp text-xl font-bold shadow-sm" onclick="window.pinKey('0')">0</button>
        <button type="button" class="key-btn py-4 rounded-2xl text-vRose flex items-center justify-center hover:bg-vRose/10 transition-colors" onclick="window.pinKey('back')"><i data-lucide="delete" class="w-6 h-6"></i></button>
      </div>
    </div>`;
    pc.classList.remove('hidden'); lucide.createIcons();
  });
};

window.pinKey = (k) => {
  if (k === 'cancel') { document.getElementById('pinContainer').classList.add('hidden'); pinReject(new Error('cancelled')); return; }
  if (k === 'back') { pinEntered = pinEntered.slice(0,-1); }
  else if (pinEntered.length < 6) { pinEntered += k; }
  
  for(let i=0; i<6; i++){
    document.getElementById(`dot-${i}`).classList.toggle('filled', i < pinEntered.length);
  }
  
  if (pinEntered.length === 6) { 
    setTimeout(() => { document.getElementById('pinContainer').classList.add('hidden'); pinResolve(pinEntered); }, 150); 
  }
};

window.handlePinKeydown = (e) => {
  if (document.getElementById('pinContainer').classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') { window.pinKey(e.key); }
  else if (e.key === 'Backspace') { window.pinKey('back'); }
  else if (e.key === 'Escape') { window.pinKey('cancel'); }
};
document.addEventListener('keydown', window.handlePinKeydown);

/* ---------------- API helper ---------------- */
window.callApi = async (path, body) => {
  const res = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || 'Server Error');
  return json;
};
window.notify = (event, details) => { if (window.session) window.callApi('/api/notify', { event, accessToken: window.session.access_token, details }).catch(()=>{}); };

/* ---------------- auth ---------------- */
window.loginGoogle = async () => { await window.supa.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.origin + window.location.pathname } }); };
window.logout = async () => { await window.supa.auth.signOut(); window.adminToken = null; localStorage.removeItem('vault_admin_token'); window.profile = null; window.session = null; window.render(); };
window.exitAdmin = () => { window.adminToken = null; localStorage.removeItem('vault_admin_token'); window.changeTab('dashboard'); };

/* ---------------- data loading ---------------- */
window.loadProfile = async () => { const { data } = await window.supa.from('profiles').select('*').eq('id', window.session.user.id).single(); window.profile = data; };
window.loadTxns = async () => { const { data } = await window.supa.from('transactions').select('*').eq('user_id', window.session.user.id).order('txn_date', { ascending:false }).order('created_at', { ascending:false }); window.txns = data || []; };
window.loadFeedback = async () => { const { data } = await window.supa.from('feedback').select('*').eq('user_id', window.session.user.id).order('created_at', { ascending:false }); window.feedbackList = data || []; };

/* ---------------- render root ---------------- */
window.render = () => {
  const root = document.getElementById('root');
  if (!window.session) { root.innerHTML = buildLanding(); lucide.createIcons(); return; }
  if (window.profile && window.profile.is_suspended) { root.innerHTML = buildSuspended(); lucide.createIcons(); return; }
  if (window.profile && !window.profile.pin_set) { root.innerHTML = buildShell(''); lucide.createIcons(); setTimeout(forceSetPin, 300); return; }
  root.innerHTML = buildShell(buildTabContent());
  lucide.createIcons(); updateNav(); window.scrollTo(0,0);
};

/* ---------------- landing (logged out) ---------------- */
function buildLanding(){
  return `
  <div class="flex-1 flex flex-col items-center justify-center px-6 text-center py-10 w-full max-w-md mx-auto fade-in">
    <div class="glass p-8 md:p-10 rounded-[36px] w-full flex flex-col items-center relative">
      <div class="w-20 h-20 rounded-[28px] bg-gradient-to-br from-vEmerald to-vGold flex items-center justify-center shadow-2xl shadow-vEmerald/20 mb-6 absolute -top-10 border-[3px] border-white dark:border-[#141414]"><i data-lucide="vault" class="w-10 h-10 text-[#04150c]"></i></div>
      <h1 class="disp text-4xl font-extrabold mb-3 mt-8">Vault</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-8 leading-relaxed px-2 font-medium">${_t('tagline')}</p>
      <button type="button" onclick="window.loginGoogle()" class="w-full flex items-center justify-center gap-3 bg-white dark:bg-white text-slate-800 px-6 py-4 rounded-2xl font-bold shadow-lg shadow-black/5 active:scale-95 transition-all border border-slate-200">

window.handleLogoTap = () => {

function updateNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    const on = b.dataset.tab === window.activeTab;
    b.classList.toggle('text-vEmerald', on); b.classList.toggle('text-slate-400', !on);
  });
  const htmlDark = document.documentElement.classList.contains('dark');
  document.getElementById('themeSlider')?.classList.toggle('translate-x-[26px]', htmlDark);
}
window.changeTab = (tab) => { if (tab === 'manage' && !window.adminToken) return; window.activeTab = tab; localStorage.setItem('vault_tab', tab); window.render(); };
window.toggleTheme = () => { const html = document.documentElement; html.classList.toggle('dark'); localStorage.setItem('vault_theme', html.classList.contains('dark') ? 'dark' : 'light'); updateNav(); };

/* ---------------- tab router ---------------- */
function buildTabContent(){
  if (window.activeTab === 'dashboard') return buildDashboard();
  if (window.activeTab === 'add') return buildAdd();
  if (window.activeTab === 'history') return buildHistory();
  if (window.activeTab === 'profile') return buildProfile();
  if (window.activeTab === 'manage' && window.adminToken) return buildManage();
  return buildDashboard();
}

/* ---------------- dashboard ---------------- */
function buildDashboard(){
  const income = window.txns.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const expense = window.txns.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const balance = income - expense;
  const now = new Date(); const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const day = now.getDate(); const left = daysInMonth - day; const pct = day / daysInMonth;
  const r = 42, circ = 2*Math.PI*r; const offset = circ * (1 - pct);
  
  return `
  <div class="cut glass p-6 md:p-8 relative overflow-hidden mb-6 shadow-sm">
    <div class="flex justify-between items-center gap-6">
      <div>
        <p class="text-vEmerald font-bold text-[10px] uppercase tracking-[0.2em] mb-1.5 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-vEmerald animate-pulse shadow-[0_0_8px_#12b76a]"></span> ${window.lang==='en'?EN_DAYS[now.getDay()]:BN_DAYS[now.getDay()]}</p>
        <h2 class="disp text-[26px] md:text-3xl font-extrabold mb-1 tracking-tight">${formatDate(now)}</h2>
        <p class="text-[13px] text-slate-500 font-medium">${_t('welcome')}, ${window.profile.full_name.split(' ')[0]}</p>
      </div>
      <svg width="100" height="100" viewBox="0 0 100 100" class="-rotate-90 shrink-0 drop-shadow-md">
        <circle cx="50" cy="50" r="${r}" fill="none" stroke-width="8" class="ring-track"></circle>
        <circle cx="50" cy="50" r="${r}" fill="none" stroke-width="8" class="ring-prog" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"></circle>
        <text x="50" y="46" text-anchor="middle" fill="currentColor" font-size="22" font-weight="800" transform="rotate(90 50 50)" font-family="Sora">${bnNum(left)}</text>
        <text x="50" y="63" text-anchor="middle" fill="currentColor" opacity="0.6" font-size="9" transform="rotate(90 50 50)">${_t('days_left')}</text>
      </svg>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4 mb-6">
    ${statCard(_t('total_in'), '৳ '+bnNum(income), 'arrow-down-circle', 'from-vEmerald to-emerald-700', ()=>window.changeTab('add'))}
    ${statCard(_t('total_out'), '৳ '+bnNum(expense), 'arrow-up-circle', 'from-vRose to-rose-700', ()=>window.changeTab('add'))}
    <div class="col-span-2 md:col-span-1 cut bg-gradient-to-br from-vGold to-amber-600 p-5 relative overflow-hidden shadow-md border border-white/20 cursor-pointer transition-transform active:scale-[0.98]" onclick="window.changeTab('history')">
      <i data-lucide="wallet" class="absolute -right-3 -bottom-3 w-24 h-24 text-white/20"></i>
      <span class="text-[10px] font-bold uppercase tracking-widest text-white/90 block mb-1 drop-shadow-sm">${_t('balance')}</span>
      <h3 class="text-2xl md:text-3xl font-extrabold disp text-white relative z-10 drop-shadow-sm tracking-tight">৳ ${bnNum(balance)}</h3>
    </div>
  </div>

  <div class="glass rounded-[24px] overflow-hidden shadow-sm">
    <div class="p-4 border-b border-white/20 dark:border-white/5 flex items-center justify-between bg-white/20 dark:bg-black/20">
      <div class="flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4 text-vEmerald"></i><h3 class="font-bold disp text-sm">${_t('recent')}</h3></div>
      <button type="button" onclick="window.changeTab('history')" class="text-[11px] font-bold text-vEmerald hover:underline">${_t('see_all')}</button>
    </div>
    <div class="divide-y divide-slate-100/50 dark:divide-white/5">
      ${window.txns.slice(0,5).map(txnRow).join('') || `<div class="p-10 text-center text-slate-500 text-sm font-medium">${_t('no_txns')}</div>`}
    </div>
  </div>`;
}

function statCard(label, value, icon, grad, onClick){
  return `<div onclick="(${onClick.toString()})()" class="cut bg-gradient-to-br ${grad} p-5 relative overflow-hidden shadow-md border border-white/20 cursor-pointer transition-transform active:scale-[0.98]">
    <i data-lucide="${icon}" class="absolute -right-3 -bottom-3 w-24 h-24 text-white/20"></i>
    <span class="text-[10px] font-bold uppercase tracking-widest text-white/90 block mb-1 drop-shadow-sm">${label}</span>
    <h3 class="text-[22px] font-extrabold disp text-white relative z-10 drop-shadow-sm tracking-tight">${value}</h3>
  </div>`;
}
function txnRow(t){
  const isIncome = t.type === 'income'; const d = new Date(t.txn_date);
  return `<div class="p-4 flex items-center gap-3 hover:bg-white/40 dark:hover:bg-white/5 transition-colors">

    </div>
    <span class="font-bold disp tracking-tight text-sm ${isIncome?'text-vEmerald':'text-vRose'}">${isIncome?'+':'-'}৳ ${bnNum(t.amount)}</span>

window.setEntryType = (type) => {
  window._entryType = type;
  document.getElementById('typeIncomeBtn').className = `flex-1 py-2.5 rounded-xl font-bold text-[13px] transition-all ${type==='income'?'bg-vEmerald text-[#04150c] shadow-sm':'text-slate-500'}`;
  document.getElementById('typeExpenseBtn').className = `flex-1 py-2.5 rounded-xl font-bold text-[13px] transition-all ${type==='expense'?'bg-vRose text-white shadow-sm':'text-slate-500'}`;
  const saveBtn = document.getElementById('entrySaveBtn');
  saveBtn.className = `w-full mt-2 py-3.5 rounded-2xl ${type==='income'?'bg-vEmerald text-[#04150c] shadow-vEmerald/30':'bg-vRose text-white shadow-vRose/30'} font-bold shadow-lg active:scale-[0.98] transition-all disp tracking-wide text-[15px] flex items-center justify-center gap-2`;
};

window.submitEntry = async () => {
  const btn = document.getElementById('entrySaveBtn'); const og = btn.innerHTML; btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin mx-auto"></i>'; btn.disabled = true; lucide.createIcons();
  try {
    const amount = Number(document.getElementById('entryAmount').value);
    const source = document.getElementById('entrySource').value.trim();
    if (!amount || amount <= 0 || !source) throw new Error(_t('req_fields'));
    const row = { user_id: window.session.user.id, type: window._entryType, category: source, amount, note: document.getElementById('entryNote').value||null, txn_date: document.getElementById('entryDate').value, ref_id: refId() };
    const { error } = await window.supa.from('transactions').insert([row]);
    if (error) throw error;
    window.showToast(_t('save_success')); window.notify('transaction_add', row);
    await window.loadTxns(); window.changeTab('dashboard');
  } catch(e){ window.showToast(e.message, 'error'); btn.innerHTML = og; btn.disabled = false; lucide.createIcons(); }
};

    <div class="space-y-3 relative z-10">
      <button type="button" onclick="window.fullReset()" class="w-full py-3 bg-vRose/10 text-vRose border border-vRose/20 rounded-xl font-bold text-[12px] hover:bg-vRose/20 transition-colors">${_t('reset_all')}</button>
      <button type="button" onclick="window.reqDeleteAccount()" class="w-full py-3 bg-red-600 text-white rounded-xl font-bold text-[12px] shadow-lg shadow-red-600/30 active:scale-[0.98] transition-all">${_t('delete_account')}</button>
    </div>
  </div>
  
  <button type="button" onclick="window.logout()" class="w-full py-4 bg-slate-800 dark:bg-white text-white dark:text-slate-900 rounded-2xl font-bold flex items-center justify-center gap-2 mb-6 shadow-lg active:scale-[0.98] transition-all"><i data-lucide="log-out" class="w-4 h-4"></i> ${_t('logout')}</button>
  `;
}

async function forceSetPin(){
  try {
    const p1 = await window.askPin('Set Security PIN', 'Create a 6-digit PIN');
    const p2 = await window.askPin('Confirm PIN', 'Enter the same PIN again');
    if (p1 !== p2) { window.showToast('Mismatch', 'error'); return setTimeout(forceSetPin, 400); }
    await window.callApi('/api/pin', { action:'set', pin:p1, accessToken: window.session.access_token });
    await window.loadProfile(); window.showToast('PIN Set!'); window.render();
  } catch(e){ setTimeout(forceSetPin, 400); }
}

window.changePin = async () => {
  try {
    const oldPin = await window.askPin('Enter Old PIN');
    const p1 = await window.askPin('Enter New PIN'); const p2 = await window.askPin('Confirm New PIN');
    if (p1 !== p2) return window.showToast('Mismatch', 'error');
    await window.callApi('/api/pin', { action:'set', pin:p1, oldPin, accessToken: window.session.access_token }); window.showToast('PIN Changed');
  } catch(e){}
};

window.fullReset = async () => {
  try {
    const pin1 = await window.askPin('Reset History (1/2)', 'Require PIN'); await window.callApi('/api/pin', { action:'verify', pin: pin1, accessToken: window.session.access_token });
    const pin2 = await window.askPin('Are you sure? (2/2)', 'Require PIN again'); await window.callApi('/api/pin', { action:'verify', pin: pin2, accessToken: window.session.access_token });
    await window.supa.from('transactions').delete().eq('user_id', window.session.user.id);
    window.showToast('History Wiped'); await window.loadTxns(); window.changeTab('dashboard');
  } catch(e){}
};

window.reqDeleteAccount = async () => {
  try {
    const pin = await window.askPin('Delete Account & Data', 'Enter PIN to confirm');
    await window.callApi('/api/pin', { action:'verify', pin, accessToken: window.session.access_token });
    localStorage.setItem('vault_pending_delete', window.session.user.id);
    await window.supa.auth.signOut();
    window.session = null; window.profile = null;
    window.render();
    window.showModal(`
      <div class="text-center">
        <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-200 dark:border-red-800/50"><i data-lucide="shield-alert" class="w-8 h-8"></i></div>
        <h3 class="disp text-xl font-bold mb-2">Re-authentication</h3>
        <p class="text-sm text-slate-500 mb-6 font-medium">To permanently erase all your data, please log in again with the same Google account.</p>
        <button onclick="window.hideModal(); window.loginGoogle();" class="w-full py-3.5 bg-red-600 text-white font-bold rounded-xl shadow-lg shadow-red-600/30 active:scale-95 transition-all">Login to Delete Data</button>
      </div>
    `);
  } catch(e){}
};

/* ---------------- cropper (1:1 with zoom/pan) ---------------- */
let cropState = { img: null, scale: 1, dx: 0, dy: 0, dragging: false, px: 0, py: 0, file: null };
window.initCropper = (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  if (file.size > 10*1024*1024) return window.showToast('Max size 10MB', 'error');
  cropState.file = file; const reader = new FileReader();
  reader.onload = (ev) => {
    const img = document.getElementById('cropperImg'); cropState.img = img;
    img.onload = () => {
      const area = document.getElementById('cropperArea');
      const boxSize = 280;
      cropState.scale = Math.max(boxSize / img.naturalWidth, boxSize / img.naturalHeight);
      const zoom = document.getElementById('cropZoom');
      zoom.min = cropState.scale; zoom.max = cropState.scale * 3; zoom.step = 0.01; zoom.value = cropState.scale;
      cropState.dx = (area.clientWidth - img.naturalWidth * cropState.scale) / 2;
      cropState.dy = (area.clientHeight - img.naturalHeight * cropState.scale) / 2;
      updateCropView();
      document.getElementById('cropperModal').classList.remove('hidden');
      document.getElementById('cropperModal').classList.add('flex');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};
function updateCropView(){ cropState.img.style.transform = `translate(${cropState.dx}px, ${cropState.dy}px) scale(${cropState.scale})`; }

document.getElementById('cropZoom').addEventListener('input', e => {
  const oldScale = cropState.scale; cropState.scale = parseFloat(e.target.value);
  const area = document.getElementById('cropperArea');
  const cx = area.clientWidth / 2; const cy = area.clientHeight / 2;
  cropState.dx = cx - (cx - cropState.dx) * (cropState.scale / oldScale);
  cropState.dy = cy - (cy - cropState.dy) * (cropState.scale / oldScale);
  updateCropView();
});
const cArea = document.getElementById('cropperArea');
cArea.addEventListener('pointerdown', e => { cropState.dragging = true; cropState.px = e.clientX; cropState.py = e.clientY; cArea.setPointerCapture(e.pointerId); });
cArea.addEventListener('pointermove', e => {
  if(!cropState.dragging) return;
  cropState.dx += (e.clientX - cropState.px); cropState.dy += (e.clientY - cropState.py);
  cropState.px = e.clientX; cropState.py = e.clientY; updateCropView();
});
cArea.addEventListener('pointerup', e => { cropState.dragging = false; cArea.releasePointerCapture(e.pointerId); });

window.closeCropper = () => { document.getElementById('cropperModal').classList.add('hidden'); document.getElementById('cropperModal').classList.remove('flex'); };
window.doCrop = () => {
  const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512; const ctx = canvas.getContext('2d');
  const area = document.getElementById('cropperArea');
  const sX = ((area.clientWidth/2 - 140) - cropState.dx) / cropState.scale;
  const sY = ((area.clientHeight/2 - 140) - cropState.dy) / cropState.scale;
  const sW = 280 / cropState.scale; const sH = 280 / cropState.scale;
  ctx.drawImage(cropState.img, sX, sY, sW, sH, 0, 0, 512, 512);
  canvas.toBlob(async (blob) => {
    window.closeCropper(); window.showToast('Uploading...', 'info');
    try {
      const path = `${window.session.user.id}/avatar_${Date.now()}.jpg`;
      await window.supa.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
      const { data: pub } = window.supa.storage.from('avatars').getPublicUrl(path);
      await window.supa.from('profiles').update({ avatar_url: pub.publicUrl }).eq('id', window.session.user.id);
      await window.loadProfile(); window.render(); window.showToast('Avatar updated!');
    } catch(err){ window.showToast(err.message, 'error'); }
  }, 'image/jpeg', 0.9);
};

/* ---------------- admin/manage ---------------- */
window.openMasterKeyModal = () => {
  window.showModal(`
    <div class="text-center mb-6"><div class="w-14 h-14 bg-vIndigo/10 text-vIndigo rounded-full flex items-center justify-center mx-auto mb-3 border border-vIndigo/20"><i data-lucide="key-round" class="w-7 h-7"></i></div><h3 class="disp text-2xl font-bold tracking-tight">Master Key</h3></div>
    <input type="password" id="masterKeyInput" class="w-full p-4 rounded-2xl glass-input text-lg text-center tracking-widest font-mono outline-none focus:border-vIndigo shadow-inner" placeholder="••••••••">
    <div class="flex gap-3 mt-6"><button type="button" onclick="window.hideModal()" class="flex-1 py-4 text-sm glass-input rounded-xl font-bold">Cancel</button><button type="button" id="mk-ok" class="flex-1 py-4 text-sm bg-vIndigo text-white rounded-xl font-bold shadow-lg shadow-vIndigo/30 active:scale-95 transition-all">Enter</button></div>
  `);
  document.getElementById('mk-ok').onclick = async () => {
    try {
      const masterKey = document.getElementById('masterKeyInput').value;
      const json = await window.callApi('/api/master-verify', { masterKey, accessToken: window.session.access_token });
      window.adminToken = json.token; localStorage.setItem('vault_admin_token', json.token);
      window.hideModal(); window.changeTab('manage');
    } catch(e){ window.showToast(e.message, 'error'); }

};

window._manageUsers = [];
async function loadManageUsers(){
  try {
    const json = await fetch('/api/admin', { method:'POST', headers:{'Content-Type':'application/json','x-admin-token':window.adminToken}, body: JSON.stringify({ action:'list_users' }) }).then(r=>r.json());
    window._manageUsers = json.users || []; window.render();
  } catch(e){}
}
function buildManage(){
  if (!window._manageUsers.length) setTimeout(loadManageUsers, 50);
  return `
  <div class="flex items-center justify-between mb-5">
    <h2 class="disp text-2xl font-extrabold flex items-center gap-2 tracking-tight"><i data-lucide="shield" class="w-6 h-6 text-vIndigo"></i> Manage</h2>
    <button onclick="window.exitAdmin()" class="text-[10px] glass-input px-3 py-2 rounded-lg font-bold">${_t('exit_admin')}</button>
  </div>
  <div class="space-y-4">
    ${window._manageUsers.map(u=>`
      <div class="glass rounded-[24px] p-5 ${u.is_suspended?'border-vRose/40 bg-vRose/5':''} shadow-sm">
        <div class="flex items-center gap-3 mb-3">
          <img src="${u.avatar_url || 'https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent(u.full_name||'U')}" class="w-11 h-11 rounded-full object-cover border shadow-sm">
          <div class="min-w-0 flex-1"><p class="font-bold text-[13px] truncate">${u.full_name||'—'}</p><p class="text-[10px] text-slate-500 font-medium truncate">${u.email}</p></div>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-white/50 dark:bg-black/20 p-2.5 rounded-xl shadow-inner"><p class="text-[9px] text-slate-500 font-bold uppercase mb-0.5">In</p><p class="font-bold text-vEmerald text-[13px]">৳${u.totalIncome}</p></div>
          <div class="bg-white/50 dark:bg-black/20 p-2.5 rounded-xl shadow-inner"><p class="text-[9px] text-slate-500 font-bold uppercase mb-0.5">Out</p><p class="font-bold text-vRose text-[13px]">৳${u.totalExpense}</p></div>
          <div class="bg-white/50 dark:bg-black/20 p-2.5 rounded-xl shadow-inner"><p class="text-[9px] text-slate-500 font-bold uppercase mb-0.5">Bal</p><p class="font-bold text-vGold text-[13px]">৳${u.balance}</p></div>
        </div>
      </div>`).join('') || `<div class="p-10 text-center text-slate-500 text-sm font-medium">Loading users...</div>`}
  </div>`;
}

/* ---------------- boot ---------------- */
async function boot(){
  try {
    window.CFG = await fetch('/api/config').then(r=>r.json());
    window.supa = createClient(window.CFG.supabaseUrl, window.CFG.supabaseAnonKey);
    const { data: { session } } = await window.supa.auth.getSession(); window.session = session;
    window.supa.auth.onAuthStateChange(async (event, s) => {
      window.session = s;
      
      // Handle pending account deletion flow
      const pendingDelId = localStorage.getItem('vault_pending_delete');
      if (s && pendingDelId) {
        if (s.user.id === pendingDelId) {
          // Erase all data
          await window.supa.from('transactions').delete().eq('user_id', s.user.id);
          await window.supa.from('feedback').delete().eq('user_id', s.user.id);
          await window.supa.from('profiles').update({ pin_set: false, pin_hash: null, avatar_url: null, full_name: 'Deleted User' }).eq('id', s.user.id);
          localStorage.removeItem('vault_pending_delete');
          window.showToast('Account data permanently deleted.');
        } else {
          // Logged in with different account, cancel deletion
          localStorage.removeItem('vault_pending_delete');
        }
      }

      if (s && !pendingDelId) { await window.loadProfile(); await window.loadTxns(); await window.loadFeedback(); }
      window.render();
    });
    
    if (window.session) { await window.loadProfile(); await window.loadTxns(); await window.loadFeedback(); }
    window.render();
    if (window.activeTab === 'add') setTimeout(()=>window.setEntryType('income'), 60);
  } catch(e) {} finally { const boot = document.getElementById('boot'); boot.classList.add('boot-hide'); setTimeout(()=>boot.remove(), 400); }
}
boot();
</script>
