<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
<title>Vault | Fund Tracker</title>
<meta name="theme-color" content="#060b09">
<script>
  if (localStorage.getItem('vault_theme') === 'light') document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    fontFamily: { display: ['"Sora"','sans-serif'], body: ['"Inter"','sans-serif'], mono: ['"JetBrains Mono"','monospace'] },
    colors: { vBg:'#060b09', vCard:'#0e1712', vEmerald:'#12b76a', vRose:'#f2495c', vGold:'#f2b705', vIndigo:'#6366f1' }
  }}
}
</script>
<style>
  :root { --focus-color: #12b76a; --focus-ring: rgba(18,183,106,0.4); }
  * { -webkit-tap-highlight-color: transparent; }
  html,body { background:#f1f5f9; min-height:100dvh; display:flex; flex-direction:column; transition: background .4s ease; overflow:hidden; }
  html.dark, html.dark body { background:#0a0a0a; }
  body { font-family:'Inter',sans-serif; }
  .disp { font-family:'Sora',sans-serif; letter-spacing:-0.01em; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .hide-scrollbar::-webkit-scrollbar{display:none} .hide-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  .glass { background:rgba(255,255,255,0.65); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.7); box-shadow: 0 8px 32px rgba(0,0,0,0.04); }
  .dark .glass { background:rgba(20,20,20,0.45); border:1px solid rgba(255,255,255,0.06); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .glass-input { background:rgba(255,255,255,0.5); backdrop-filter:blur(12px); border:1px solid rgba(0,0,0,0.05); }
  .dark .glass-input { background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.05); }
  .dyn-focus:focus { border-color: var(--focus-color) !important; box-shadow: 0 0 0 1.5px var(--focus-ring) !important; }
  .cut{ clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px) }
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .fade-in{animation:fadeIn .4s cubic-bezier(.16,1,.3,1) forwards} @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .pop-in{animation:popIn .35s cubic-bezier(.16,1,.3,1) forwards} @keyframes popIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  .toast-in{animation:toastIn .3s ease-out forwards} @keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:translateX(0)}}
  #boot{transition:opacity .4s ease,visibility .4s ease} .boot-hide{opacity:0;visibility:hidden;pointer-events:none}
  ::selection{background:#12b76a;color:#04150c}
  .ring-track{stroke:rgba(255,255,255,.08)} .dark .ring-track{stroke:rgba(255,255,255,.08)}
  .ring-prog{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.16,1,.3,1), stroke 0.4s ease;}
  .key-btn{transition:transform .12s ease,background .12s ease} .key-btn:active{transform:scale(.92)}
  .dot{width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.1);transition:all .2s ease}
  .dark .dot{background:rgba(255,255,255,.12)}
  .dot.filled{background:#12b76a;box-shadow:0 0 12px rgba(18,183,106,.6)}
</style>
</head>
<body class="text-slate-900 dark:text-slate-100 flex flex-col h-full w-full">

<div id="boot" class="fixed inset-0 bg-[#f1f5f9] dark:bg-[#0a0a0a] z-[999] flex flex-col items-center justify-center gap-6">
  <div class="w-24 h-24 rounded-[32px] bg-gradient-to-br from-vEmerald to-vGold flex items-center justify-center shadow-[0_0_40px_rgba(18,183,106,0.3)] animate-pulse border-4 border-white dark:border-[#141414]">
    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#04150c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8.5 8.5v.01"/><path d="M15.5 8.5v.01"/><path d="M15.5 15.5v.01"/><path d="M8.5 15.5v.01"/><path d="M12 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/></svg>
  </div>
  <div class="flex flex-col items-center gap-2">
    <h2 class="disp font-extrabold text-2xl tracking-tight text-slate-800 dark:text-white">Vault</h2>
    <div class="flex items-center gap-2 mt-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-vEmerald animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">Database Loading</p>
    </div>
  </div>
</div>

<div id="root" class="flex-1 flex flex-col w-full h-full relative overflow-y-auto"></div>

<div id="modalContainer" class="fixed inset-0 bg-slate-900/60 dark:bg-black/80 z-[100] hidden flex justify-center items-center px-4 backdrop-blur-md overflow-y-auto py-8"></div>
<div id="pinContainer" class="fixed inset-0 bg-slate-900/70 dark:bg-black/85 z-[150] hidden flex justify-center items-end backdrop-blur-md"></div>
<div id="toast-container" class="fixed top-8 right-4 z-[300] flex flex-col gap-2 pointer-events-none"></div>

<div id="cropperModal" class="fixed inset-0 bg-black/95 z-[999] hidden flex-col touch-none">
  <div class="flex-1 relative overflow-hidden" id="cropperArea">
    <img id="cropperImg" class="absolute pointer-events-none origin-top-left" style="max-width:none!important">
    <div class="absolute pointer-events-none" style="box-shadow: 0 0 0 9999px rgba(0,0,0,0.8); border: 2px solid white; border-radius: 50%; width: 280px; height: 280px; left: 50%; top: 50%; margin-left: -140px; margin-top: -140px;">
      <div class="absolute w-full h-1/3 top-1/3 border-y border-white/30"></div>
      <div class="absolute w-1/3 h-full left-1/3 border-x border-white/30"></div>
    </div>
  </div>
  <div class="p-6 pb-10 bg-slate-900">
    <div class="flex items-center gap-4 mb-6">
      <i data-lucide="zoom-out" class="w-5 h-5 text-slate-400"></i>
      <input type="range" id="cropZoom" class="flex-1 accent-vEmerald">
      <i data-lucide="zoom-in" class="w-5 h-5 text-slate-400"></i>
    </div>
    <div class="flex gap-4">
      <button onclick="window.closeCropper()" class="px-5 py-3.5 bg-slate-800 rounded-xl font-bold flex-1 text-white">Cancel</button>
      <button onclick="window.doCrop()" class="px-5 py-3.5 bg-vEmerald text-[#04150c] rounded-xl font-bold flex-1 shadow-lg">Save Profile</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm';

window.lang = localStorage.getItem('vault_lang') || 'en';
const LANG = {
  bn: {
    dashboard: "হোম", add: "এন্ট্রি", history: "হিস্ট্রি", manage: "ম্যানেজ", profile: "প্রোফাইল",
    welcome: "স্বাগতম", days_left: "দিন বাকি", total_in: "মোট আয়", total_out: "মোট ব্যয়", balance: "ফান্ডে আছে",
    recent: "সাম্প্রতিক লেনদেন", see_all: "সব দেখুন", no_txns: "এখনো কোনো এন্ট্রি নেই।",
    new_entry: "নতুন এন্ট্রি", income: "আয়", expense: "ব্যয়",
    amount_label: "পরিমাণ (৳)", where_label: "কোথায় আয়/ব্যয় হয়েছে?", note_label: "নোট (ঐচ্ছিক)", date_label: "তারিখ", save: "সেভ করুন",
    history_title: "সম্পূর্ণ হিস্ট্রি", search: "খুঁজুন...", all: "সব", del: "মুছুন",
    change_pin: "পিন পরিবর্তন করুন", danger: "বিপদজনক অঞ্চল", reset_all: "সম্পূর্ণ হিস্ট্রি রিসেট করুন",
    delete_account: "অ্যাকাউন্ট ও ডেটা ডিলিট করুন", logout: "লগআউট", lang_switch: "Switch to English", exit_admin: "অ্যাডমিন প্যানেল থেকে প্রস্থান",
    save_success: "এন্ট্রি সেভ হয়েছে!", req_fields: "পরিমাণ ও উৎস দিন",
    bulk_del_all: "সম্পূর্ণ হিস্ট্রি ডিলিট করুন", bulk_del_inc: "সকল আয় হিস্ট্রি ডিলিট করুন", bulk_del_exp: "সকল ব্যয় হিস্ট্রি ডিলিট করুন",
    del_confirm_1: "ডিলিট কনফার্মেশন (১/২)", del_confirm_2: "চূড়ান্ত কনফার্মেশন (২/২)", enter_pin_cont: "চালিয়ে যেতে পিন দিন", enter_pin_perm: "স্থায়ীভাবে ডিলিট করতে আবার পিন দিন"
  },
  en: {
    dashboard: "Home", add: "Entry", history: "History", manage: "Manage", profile: "Profile",
    welcome: "Welcome", days_left: "Days Left", total_in: "Total Income", total_out: "Total Expense", balance: "Balance",
    recent: "Recent Transactions", see_all: "See All", no_txns: "No entries yet.",
    new_entry: "New Entry", income: "Income", expense: "Expense",
    amount_label: "Amount (৳)", where_label: "Source / Destination?", note_label: "Note (Optional)", date_label: "Date", save: "Save Entry",
    history_title: "Full History", search: "Search...", all: "All", del: "Delete",
    change_pin: "Change PIN", danger: "Danger Zone", reset_all: "Reset Full History",
    delete_account: "Delete Account & Data", logout: "Logout", lang_switch: "Switch to Bengali", exit_admin: "Exit Admin Mode",
    save_success: "Entry saved!", req_fields: "Amount and Source required",
    bulk_del_all: "Delete All History", bulk_del_inc: "Delete All Income History", bulk_del_exp: "Delete All Expense History",
    del_confirm_1: "Bulk Delete (1/2)", del_confirm_2: "Final Confirm (2/2)", enter_pin_cont: "Enter PIN to continue", enter_pin_perm: "Enter PIN again to permanently delete"
  }
};
window._t = (key) => LANG[window.lang][key] || key;

window.supa = null; window.session = null; window.profile = null; window.isAuthLoading = false;
window.adminToken = localStorage.getItem('vault_admin_token') || null;
window.activeTab = localStorage.getItem('vault_tab') || 'dashboard';
window.txns = []; window.feedbackList = []; window.CFG = {}; window.logoTapCount = 0;
window.authMode = 'login'; // login, register, phone

const BN_DAYS = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const EN_DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const EN_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const refId = () => Math.random().toString(36).substr(2,6).toUpperCase();
const bnNum = (n) => window.lang === 'bn' ? String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]) : Number(n).toLocaleString('en-US');
const formatDate = (dateObj) => {
  if (window.lang === 'en') return `${EN_MONTHS[dateObj.getMonth()]} ${dateObj.getDate()}, ${dateObj.getFullYear()}`;
  return `${BN_MONTHS[dateObj.getMonth()]} ${bnNum(dateObj.getDate())}, ${bnNum(dateObj.getFullYear())}`;
};

const getLocalDateString = () => {
  const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

window.showToast = (msg, type='success') => {
  const c = document.getElementById('toast-container'); const t = document.createElement('div');
  let colors = type==='success' ? 'bg-vEmerald text-[#04150c]' : (type==='error' ? 'bg-vRose text-white' : 'bg-vIndigo text-white');
  let icon = type==='success' ? 'check-circle' : (type==='error' ? 'alert-circle' : 'loader-2');
  let spin = type==='info' ? 'animate-spin' : '';
  t.className = `toast-in flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl ${colors} text-sm font-bold max-w-xs border border-white/10`;
  t.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 shrink-0 ${spin}"></i><span>${msg}</span>`;
  c.appendChild(t); lucide.createIcons();
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(20px)'; t.style.transition='all .3s'; setTimeout(()=>t.remove(),300); }, type==='info' ? 1500 : 3200);
};

window.showModal = (html) => {
  const mc = document.getElementById('modalContainer');
  mc.innerHTML = `<div class="glass w-full max-w-sm rounded-3xl p-6 border pop-in shadow-2xl relative my-auto max-h-[85vh] overflow-y-auto hide-scrollbar">${html}</div>`;
  mc.classList.remove('hidden'); lucide.createIcons();
  mc.onclick = (e)=>{ if(e.target===mc) window.hideModal(); };
};
window.hideModal = () => document.getElementById('modalContainer').classList.add('hidden');

// Eye icon toggle for password
window.togglePw = (id) => {
  const el = document.getElementById(id); const icon = document.getElementById(id+'-icon');
  if(el.type === 'password'){ el.type = 'text'; icon.setAttribute('data-lucide', 'eye-off'); }
  else { el.type = 'password'; icon.setAttribute('data-lucide', 'eye'); }
  lucide.createIcons();
};

let pinResolve, pinReject, pinEntered = '';
window.askPin = (title, subtitle='', showForgot=false) => {
  return new Promise((resolve, reject) => {
    pinResolve = resolve; pinReject = reject; pinEntered = '';
    const pc = document.getElementById('pinContainer');
    pc.innerHTML = `
    <div class="w-full max-w-md glass rounded-t-[36px] border-t border-x border-white/20 p-6 pb-8 pop-in relative">
      <div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-vGold/10 text-vGold rounded-full flex items-center justify-center mx-auto mb-3 border border-vGold/20"><i data-lucide="lock-keyhole" class="w-6 h-6"></i></div>
        <h3 class="disp font-bold text-xl tracking-tight">${title}</h3>
        ${subtitle ? `<p class="text-xs text-slate-500 mt-1.5">${subtitle}</p>` : ''}
      </div>
      <div class="flex justify-center gap-3 mb-8" id="pinDots">
        ${[0,1,2,3,4,5].map(i=>`<div class="dot" id="dot-${i}"></div>`).join('')}
      </div>
      <div class="grid grid-cols-3 gap-3 max-w-[260px] mx-auto">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="key-btn py-4 rounded-2xl bg-white/40 dark:bg-white/5 border border-white/50 dark:border-white/5 disp text-xl font-bold shadow-sm" onclick="window.pinKey('${n}')">${n}</button>`).join('')}
        <button type="button" class="key-btn py-4 rounded-2xl text-slate-400 font-bold text-xs hover:text-slate-600 dark:hover:text-slate-200" onclick="window.pinKey('cancel')"><i data-lucide="x" class="w-6 h-6 mx-auto"></i></button>
        <button type="button" class="key-btn py-4 rounded-2xl bg-white/40 dark:bg-white/5 border border-white/50 dark:border-white/5 disp text-xl font-bold shadow-sm" onclick="window.pinKey('0')">0</button>
        <button type="button" class="key-btn py-4 rounded-2xl text-vRose flex items-center justify-center hover:bg-vRose/10 transition-colors" onclick="window.pinKey('back')"><i data-lucide="delete" class="w-6 h-6"></i></button>
      </div>
      ${showForgot ? `<button onclick="window.forgotPin()" class="w-full text-center mt-6 text-[12px] font-bold text-slate-500 hover:text-vIndigo transition-colors">Forgot PIN?</button>` : ''}
    </div>`;
    pc.classList.remove('hidden'); lucide.createIcons();
  });
};

window.pinKey = (k) => {
  if (k === 'cancel') { document.getElementById('pinContainer').classList.add('hidden'); pinReject(new Error('cancelled')); return; }
  if (k === 'back') { pinEntered = pinEntered.slice(0,-1); }
  else if (pinEntered.length < 6) { pinEntered += k; }
  for(let i=0; i<6; i++) document.getElementById(`dot-${i}`).classList.toggle('filled', i < pinEntered.length);
  if (pinEntered.length === 6) { setTimeout(() => { document.getElementById('pinContainer').classList.add('hidden'); pinResolve(pinEntered); }, 50); }
};
window.handlePinKeydown = (e) => {
  if (document.getElementById('pinContainer').classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') window.pinKey(e.key);
  else if (e.key === 'Backspace') window.pinKey('back');
  else if (e.key === 'Escape') window.pinKey('cancel');
};
document.addEventListener('keydown', window.handlePinKeydown);

window.forgotPin = async () => {
  document.getElementById('pinContainer').classList.add('hidden');
  window.showToast('Please log in again to verify identity.', 'info');
  await window.logout();
};

window.callApi = async (path, body) => {
  const res = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || 'Server Error');
  return json;
};
window.notify = (event, details) => { if (window.session) window.callApi('/api/notify', { event, accessToken: window.session.access_token, details }).catch(()=>{}); };

// -- Auth Functions --
window.loginProvider = async (provider) => { await window.supa.auth.signInWithOAuth({ provider, options:{ redirectTo: window.location.origin + window.location.pathname } }); };
window.loginEmail = async () => {
  const e = document.getElementById('auth-email').value; const p = document.getElementById('auth-pw').value;
  if(!e || !p) return window.showToast('Fill all fields', 'error');
  window.showToast('Logging in...', 'info');
  const { error } = await window.supa.auth.signInWithPassword({ email: e, password: p });
  if(error) window.showToast(error.message, 'error'); else window.showToast('Success');
};
window.registerEmail = async () => {
  const e = document.getElementById('auth-email').value; const p = document.getElementById('auth-pw').value;
  if(!e || !p) return window.showToast('Fill all fields', 'error');
  window.showToast('Registering...', 'info');
  const { error } = await window.supa.auth.signUp({ email: e, password: p });
  if(error) window.showToast(error.message, 'error'); else window.showToast('Check email for verification link!');
};

window.logout = async () => { await window.supa.auth.signOut(); window.adminToken = null; localStorage.removeItem('vault_admin_token'); window.profile = null; window.session = null; window.render(); };
window.exitAdmin = () => { window.adminToken = null; localStorage.removeItem('vault_admin_token'); window.changeTab('dashboard'); };

window.loadProfile = async () => {
  try {
    const { data, error } = await window.supa.from('profiles').select('*').eq('id', window.session.user.id).single();
    if(error) throw error; window.profile = data;
  } catch(e) { console.error(e); }
};
window.loadTxns = async () => {
  try {
    const { data, error } = await window.supa.from('transactions').select('*').eq('user_id', window.session.user.id).order('txn_date', { ascending:false }).order('created_at', { ascending:false });
    if(error) throw error; window.txns = data || [];
  } catch(e) { console.error(e); window.showToast('Failed to load data', 'error'); }
};

window.render = () => {
  const root = document.getElementById('root');
  if (!window.session) { root.innerHTML = buildLanding(); lucide.createIcons(); return; }
  if (window.profile && window.profile.is_suspended) { root.innerHTML = buildSuspended(); lucide.createIcons(); return; }
  if (window.profile && !window.profile.pin_set) { root.innerHTML = buildShell(''); lucide.createIcons(); setTimeout(forceSetPin, 300); return; }
  
  // Verify fresh login bypass for PIN (if needed) handled securely via verify logic
  if(window.profile && window.profile.pin_set && !window._pinVerified) {
    root.innerHTML = buildShell(''); lucide.createIcons(); setTimeout(verifyPinAccess, 300); return;
  }
  
  root.innerHTML = buildShell(buildTabContent());
  lucide.createIcons(); updateNav();
};

window.switchAuthMode = (mode) => { window.authMode = mode; window.render(); };

function buildLanding(){
  let formHtml = '';
  if (window.authMode === 'login' || window.authMode === 'register') {
    const isLogin = window.authMode === 'login';
    formHtml = `
      <div class="space-y-3 w-full fade-in">
        <input type="email" id="auth-email" placeholder="Email address" class="w-full px-4 py-3.5 rounded-2xl glass-input dyn-focus text-[14px] outline-none">
        <div class="relative">

window.handleLogoTap = () => {
  const adminEmail = window.CFG?.superAdminEmail?.toLowerCase().trim();
  const userEmail = window.profile?.email?.toLowerCase().trim();
  if (!adminEmail || !userEmail || adminEmail !== userEmail) return;
  window.logoTapCount++; 
  if (window.logoTapCount >= 5) { window.logoTapCount = 0; window.openMasterKeyModal(); }
  setTimeout(()=>{ window.logoTapCount = 0; }, 2500);
};

function updateNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    const on = b.dataset.tab === window.activeTab;
    if(on){
      b.classList.add('text-vEmerald', 'bg-slate-200/60', 'dark:bg-white/10', 'rounded-xl');
      b.classList.remove('text-slate-400');
    }else{
      b.classList.remove('text-vEmerald', 'bg-slate-200/60', 'dark:bg-white/10', 'rounded-xl');
      b.classList.add('text-slate-400');
    }
  });
  const htmlDark = document.documentElement.classList.contains('dark');
  document.querySelectorAll('.themeSlider').forEach(el => {
    if(el.parentElement.classList.contains('hidden')){ el.classList.toggle('translate-x-[24px]', htmlDark); } 
    else { el.classList.toggle('translate-x-[26px]', htmlDark); }
  });
}
window.changeTab = (tab) => { if (tab === 'manage' && !window.adminToken) return; window.activeTab = tab; localStorage.setItem('vault_tab', tab); window.render(); };
window.toggleTheme = () => { const html = document.documentElement; html.classList.toggle('dark'); localStorage.setItem('vault_theme', html.classList.contains('dark') ? 'dark' : 'light'); updateNav(); };

function buildTabContent(){
  if (window.activeTab === 'dashboard') return buildDashboard();
  if (window.activeTab === 'add') return buildAdd();
  if (window.activeTab === 'history') return buildHistory();
  if (window.activeTab === 'profile') return buildProfile();
  if (window.activeTab === 'manage' && window.adminToken) return buildManage();
  return buildDashboard();
}

function buildDashboard(){
  const income = window.txns.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const expense = window.txns.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const balance = income - expense;
  const now = new Date(); const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const left = daysInMonth - now.getDate(); const pct = left / daysInMonth;
  const r = 42, circ = 2*Math.PI*r; const offset = circ * (1 - pct);
  let progColor = '#12b76a'; if(pct < 0.25) progColor = '#f2495c'; else if(pct < 0.5) progColor = '#f97316'; else if(pct < 0.75) progColor = '#f2b705';

  return `
  <div class="cut glass p-6 md:p-8 relative overflow-hidden mb-6 shadow-sm">
    <div class="flex justify-between items-center gap-6">
      <div>
        <p class="text-vEmerald font-bold text-[10px] uppercase tracking-[0.2em] mb-1.5 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-vEmerald animate-pulse shadow-[0_0_8px_#12b76a]"></span> ${window.lang==='en'?EN_DAYS[now.getDay()]:BN_DAYS[now.getDay()]}</p>
        <h2 class="disp text-[26px] md:text-3xl font-extrabold mb-1 tracking-tight">${formatDate(now)}</h2>
        <p class="text-[13px] text-slate-500 font-medium">${_t('welcome')}, ${window.profile.full_name?.split(' ')[0]||'User'}</p>
      </div>
      <svg width="100" height="100" viewBox="0 0 100 100" class="-rotate-90 shrink-0 drop-shadow-md">
        <circle cx="50" cy="50" r="${r}" fill="none" stroke-width="8" class="ring-track"></circle>
        <circle cx="50" cy="50" r="${r}" fill="none" stroke-width="8" class="ring-prog" stroke="${progColor}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"></circle>
        <text x="50" y="46" text-anchor="middle" fill="currentColor" font-size="22" font-weight="800" transform="rotate(90 50 50)" font-family="Sora">${bnNum(left)}</text>
        <text x="50" y="63" text-anchor="middle" fill="currentColor" opacity="0.6" font-size="9" transform="rotate(90 50 50)">${_t('days_left')}</text>
      </svg>
    </div>
  </div>
  <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4 mb-6">
    ${statCard(_t('total_in'), '৳ '+bnNum(income), 'arrow-down-circle', 'from-vEmerald to-emerald-700', ()=>window.changeTab('add'))}
    ${statCard(_t('total_out'), '৳ '+bnNum(expense), 'arrow-up-circle', 'from-vRose to-rose-700', ()=>window.changeTab('add'))}
    <div class="col-span-2 md:col-span-1 cut bg-gradient-to-br from-vGold to-amber-600 p-5 relative overflow-hidden shadow-md border border-white/20 cursor-pointer transition-transform active:scale-[0.98]" onclick="window.changeTab('history')">
      <i data-lucide="wallet" class="absolute -right-3 -bottom-3 w-24 h-24 text-white/20"></i>
      <span class="text-[10px] font-bold uppercase tracking-widest text-white/90 block mb-1 drop-shadow-sm">${_t('balance')}</span>
      <h3 class="text-2xl md:text-3xl font-extrabold disp text-white relative z-10 drop-shadow-sm tracking-tight">৳ ${bnNum(balance)}</h3>
    </div>
  </div>
  <div class="glass rounded-[24px] overflow-hidden shadow-sm">
    <div class="p-4 border-b border-white/20 dark:border-white/5 flex items-center justify-between bg-white/20 dark:bg-black/20">
      <div class="flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4 text-vEmerald"></i><h3 class="font-bold disp text-sm">${_t('recent')}</h3></div>
      <button type="button" onclick="window.changeTab('history')" class="text-[11px] font-bold text-vEmerald hover:underline">${_t('see_all')}</button>
    </div>
    <div class="divide-y divide-slate-100/50 dark:divide-white/5">
      ${window.txns.slice(0,5).map(txnRow).join('') || `<div class="p-10 text-center text-slate-500 text-sm font-medium">${_t('no_txns')}</div>`}
    </div>
  </div>`;
}

function statCard(label, value, icon, grad, onClick){
  return `<div onclick="(${onClick.toString()})()" class="cut bg-gradient-to-br ${grad} p-5 relative overflow-hidden shadow-md border border-white/20 cursor-pointer transition-transform active:scale-[0.98]">

}

let cropState = { img: null, scale: 1, dx: 0, dy: 0, dragging: false, px: 0, py: 0, file: null, pointers: [], initDist: 0, initScale: 1 };
window.initCropper = (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  if (file.size > 10*1024*1024) return window.showToast('Max size 10MB', 'error');
  cropState.file = file; const reader = new FileReader();
  reader.onload = (ev) => {
    const img = document.getElementById('cropperImg'); cropState.img = img;
    img.onload = () => {
      const area = document.getElementById('cropperArea');
      const boxSize = 280;
      cropState.scale = Math.max(boxSize / img.naturalWidth, boxSize / img.naturalHeight);
      const zoom = document.getElementById('cropZoom');
      zoom.min = cropState.scale; zoom.max = cropState.scale * 3; zoom.step = 0.01; zoom.value = cropState.scale;
      
      // Calculate exact center position
      cropState.dx = (area.clientWidth - (img.naturalWidth * cropState.scale)) / 2;
      cropState.dy = (area.clientHeight - (img.naturalHeight * cropState.scale)) / 2;
      
      applyBounds(); updateCropView();
      document.getElementById('cropperModal').classList.remove('hidden'); document.getElementById('cropperModal').classList.add('flex');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};
function updateCropView(){ cropState.img.style.transform = `translate(${cropState.dx}px, ${cropState.dy}px) scale(${cropState.scale})`; }
function applyBounds() {
  const minScale = Math.max(280 / cropState.img.naturalWidth, 280 / cropState.img.naturalHeight);
  if (cropState.scale < minScale) cropState.scale = minScale;
  const area = document.getElementById('cropperArea');
  const cx = area.clientWidth / 2; const cy = area.clientHeight / 2;
  const maxDx = cx - 140; const minDx = cx + 140 - (cropState.img.naturalWidth * cropState.scale);
  const maxDy = cy - 140; const minDy = cy + 140 - (cropState.img.naturalHeight * cropState.scale);
  if (cropState.dx > maxDx) cropState.dx = maxDx; if (cropState.dx < minDx) cropState.dx = minDx;
  if (cropState.dy > maxDy) cropState.dy = maxDy; if (cropState.dy < minDy) cropState.dy = minDy;
}

document.getElementById('cropZoom').addEventListener('input', e => {
  const oldScale = cropState.scale; cropState.scale = parseFloat(e.target.value);
  const area = document.getElementById('cropperArea');
  const cx = area.clientWidth / 2; const cy = area.clientHeight / 2;
  cropState.dx = cx - (cx - cropState.dx) * (cropState.scale / oldScale);
  cropState.dy = cy - (cy - cropState.dy) * (cropState.scale / oldScale);
  applyBounds(); updateCropView();
});

const cArea = document.getElementById('cropperArea');
cArea.addEventListener('pointerdown', e => { 
  cropState.pointers.push(e);
  if (cropState.pointers.length === 2) { cropState.initDist = Math.hypot(cropState.pointers[0].clientX - cropState.pointers[1].clientX, cropState.pointers[0].clientY - cropState.pointers[1].clientY); cropState.initScale = cropState.scale; } 
  else if (cropState.pointers.length === 1) { cropState.dragging = true; cropState.px = e.clientX; cropState.py = e.clientY; cArea.setPointerCapture(e.pointerId); }
});
cArea.addEventListener('pointermove', e => {
  const index = cropState.pointers.findIndex(p => p.pointerId === e.pointerId); if (index !== -1) cropState.pointers[index] = e;
  if (cropState.pointers.length === 2) {
    const dist = Math.hypot(cropState.pointers[0].clientX - cropState.pointers[1].clientX, cropState.pointers[0].clientY - cropState.pointers[1].clientY);
    const zoomFactor = dist / cropState.initDist; const oldScale = cropState.scale; let newScale = cropState.initScale * zoomFactor;
    const minScale = Math.max(280 / cropState.img.naturalWidth, 280 / cropState.img.naturalHeight);
    if(newScale < minScale) newScale = minScale; cropState.scale = newScale;
    const cx = cArea.clientWidth / 2; const cy = cArea.clientHeight / 2;
    cropState.dx = cx - (cx - cropState.dx) * (cropState.scale / oldScale); cropState.dy = cy - (cy - cropState.dy) * (cropState.scale / oldScale);
    applyBounds(); updateCropView(); document.getElementById('cropZoom').value = cropState.scale;
  } else if (cropState.dragging && cropState.pointers.length === 1) {
    cropState.dx += (e.clientX - cropState.px); cropState.dy += (e.clientY - cropState.py); cropState.px = e.clientX; cropState.py = e.clientY; applyBounds(); updateCropView();
  }
});
const handlePointerUp = e => {
  cropState.pointers = cropState.pointers.filter(p => p.pointerId !== e.pointerId);
  if (cropState.pointers.length < 2 && cropState.pointers.length === 1) { cropState.px = cropState.pointers[0].clientX; cropState.py = cropState.pointers[0].clientY; }
  if(cropState.pointers.length === 0) { cropState.dragging = false; cArea.releasePointerCapture(e.pointerId); }
};
cArea.addEventListener('pointerup', handlePointerUp); cArea.addEventListener('pointercancel', handlePointerUp);
window.closeCropper = () => { document.getElementById('cropperModal').classList.add('hidden'); document.getElementById('cropperModal').classList.remove('flex'); };
window.doCrop = () => {
  const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512; const ctx = canvas.getContext('2d'); const area = document.getElementById('cropperArea');
  const sX = ((area.clientWidth/2 - 140) - cropState.dx) / cropState.scale; const sY = ((area.clientHeight/2 - 140) - cropState.dy) / cropState.scale;
  const sW = 280 / cropState.scale; const sH = 280 / cropState.scale; ctx.drawImage(cropState.img, sX, sY, sW, sH, 0, 0, 512, 512);
  canvas.toBlob(async (blob) => {
    window.closeCropper(); window.showToast('Uploading...', 'info');
    try {
      const path = `${window.session.user.id}/avatar_${Date.now()}.jpg`;
      await window.supa.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: true });

      await window.loadProfile(); window.render(); window.showToast('Avatar updated!');

  }, 'image/jpeg', 0.9);
};

    ${window._manageUsers.map(u=>`
      <div class="glass rounded-[24px] p-5 ${u.is_suspended?'border-vRose/40 bg-vRose/5':''} shadow-sm">
        <div class="flex items-center gap-3 mb-3">
          <img src="${u.avatar_url || 'https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent(u.full_name||'U')}" class="w-11 h-11 rounded-full object-cover border shadow-sm">
          <div class="min-w-0 flex-1"><p class="font-bold text-[13px] truncate">${u.full_name||'—'}</p><p class="text-[10px] text-slate-500 font-medium truncate">${u.email}</p></div>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-white/50 dark:bg-black/20 p-2.5 rounded-xl shadow-inner"><p class="text-[9px] text-slate-500 font-bold uppercase mb-0.5">In</p><p class="font-bold text-vEmerald text-[13px]">৳${u.totalIncome}</p></div>
          <div class="bg-white/50 dark:bg-black/20 p-2.5 rounded-xl shadow-inner"><p class="text-[9px] text-slate-500 font-bold uppercase mb-0.5">Out</p><p class="font-bold text-vRose text-[13px]">৳${u.totalExpense}</p></div>
          <div class="bg-white/50 dark:bg-black/20 p-2.5 rounded-xl shadow-inner"><p class="text-[9px] text-slate-500 font-bold uppercase mb-0.5">Bal</p><p class="font-bold text-vGold text-[13px]">৳${u.balance}</p></div>
        </div>
      </div>`).join('') || `<div class="p-10 text-center text-slate-500 text-sm font-medium">Loading users...</div>`}
  </div>`;
}

async function boot(){
  try {
    const cfgRes = await fetch('/api/config');
    if(!cfgRes.ok) throw new Error('Config load failed');
    window.CFG = await cfgRes.json();
    window.supa = createClient(window.CFG.supabaseUrl, window.CFG.supabaseAnonKey);
    const { data: { session } } = await window.supa.auth.getSession(); window.session = session;
    window.supa.auth.onAuthStateChange(async (event, s) => {
      window.session = s;
      const pendingDelId = localStorage.getItem('vault_pending_delete');
      if (s && pendingDelId) {
        if (s.user.id === pendingDelId) {
          document.body.insertAdjacentHTML('beforeend', `<div id="del-overlay" class="fixed inset-0 bg-black/90 z-[9999] flex flex-col items-center justify-center text-white"><i data-lucide="loader-2" class="w-10 h-10 animate-spin mb-4 text-red-500"></i><p class="font-bold text-lg animate-pulse">Deleting completely...</p></div>`);
          lucide.createIcons();
          try {
             await window.callApi('/api/pin', { action: 'delete_account', accessToken: s.access_token });
             window.showToast('Account permanently deleted!', 'success');
          } catch(err) { window.showToast('Failed to delete account', 'error'); }
          localStorage.removeItem('vault_pending_delete'); await window.supa.auth.signOut();
          document.getElementById('del-overlay')?.remove(); window.session = null; window.profile = null; window._pinVerified = false; window.render(); return;
        } else { localStorage.removeItem('vault_pending_delete'); }
      }
      if (s && !pendingDelId) { 
        try { await Promise.all([window.loadProfile(), window.loadTxns()]); } catch(e){}
      }
      window.render();
    });
    if (window.session) { 
      try { await Promise.all([window.loadProfile(), window.loadTxns()]); } catch(e){}
    }
    window.render();
    if (window.activeTab === 'add') setTimeout(()=>window.setEntryType('income'), 60);
  } catch(e) { 
    document.getElementById('root').innerHTML = `<div class="flex-1 flex flex-col items-center justify-center text-center px-6"><p class="text-sm text-slate-500 mb-4">Network error. Please try again.</p><button onclick="window.location.reload()" class="px-6 py-3 bg-vEmerald text-[#04150c] rounded-xl font-bold">Reload App</button></div>`;
  } finally { 
    const boot = document.getElementById('boot'); boot.classList.add('boot-hide'); setTimeout(()=>boot.remove(), 400); 
  }
}
boot();
</script>
