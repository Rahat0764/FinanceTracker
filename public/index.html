<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vault | ব্যক্তিগত ফান্ড ট্র্যাকার</title>
<meta name="theme-color" content="#060b09">
<script>
  if (localStorage.getItem('vault_theme') === 'light') document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    fontFamily: { display: ['"Sora"','sans-serif'], body: ['"Hind Siliguri"','sans-serif'], mono: ['"JetBrains Mono"','monospace'] },
    colors: { vBg:'#060b09', vCard:'#0e1712', vBorder:'#1b2620', vEmerald:'#12b76a', vEmeraldDim:'#0a7a45', vRose:'#f2495c', vGold:'#f2b705', vIndigo:'#6366f1' }
  }}
}
</script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html,body { background:#f6f9f7; height:100dvh; display:flex; flex-direction:column; overflow:hidden; transition: background .4s ease; }
  html.dark, html.dark body { background:#060b09; }
  body { font-family:'Hind Siliguri','Sora',sans-serif; }
  .disp { font-family:'Sora',sans-serif; letter-spacing:-0.01em; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .hide-scrollbar::-webkit-scrollbar{display:none} .hide-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  .glass{ background:rgba(255,255,255,.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-color:rgba(15,23,20,.08) }
  .dark .glass{ background:rgba(14,23,18,.82); border-color:rgba(255,255,255,.06) }
  .cut{ clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px) }
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .fade-in{animation:fadeIn .4s cubic-bezier(.16,1,.3,1) forwards} @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .pop-in{animation:popIn .35s cubic-bezier(.16,1,.3,1) forwards} @keyframes popIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  .toast-in{animation:toastIn .3s ease-out forwards} @keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:translateX(0)}}
  #boot{transition:opacity .4s ease,visibility .4s ease} .boot-hide{opacity:0;visibility:hidden;pointer-events:none}
  ::selection{background:#12b76a;color:#04150c}
  .ring-track{stroke:rgba(255,255,255,.08)} .dark .ring-track{stroke:rgba(255,255,255,.08)} .ring-prog{stroke:#f2b705;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.16,1,.3,1)}
  .key-btn{transition:transform .12s ease,background .12s ease} .key-btn:active{transform:scale(.92)}
  .dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.12);transition:all .2s ease}
  .dot.filled{background:#12b76a;box-shadow:0 0 12px rgba(18,183,106,.6)}
</style>
</head>
<body class="text-slate-900 dark:text-slate-100 flex flex-col h-full w-full">

<div id="boot" class="fixed inset-0 bg-[#060b09] z-[999] flex flex-col items-center justify-center gap-4">
  <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-vEmerald to-vGold flex items-center justify-center shadow-2xl shadow-vEmerald/30 animate-pulse">
    <i data-lucide="vault" class="w-8 h-8 text-[#04150c]"></i>
  </div>
  <div class="flex items-center gap-2 text-vGold mt-1">
    <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
    <p class="text-[11px] font-bold uppercase tracking-[0.2em] text-slate-300">সংযুক্ত হচ্ছে...</p>
  </div>
</div>

<div id="root"></div>
<div id="modalContainer" class="fixed inset-0 bg-slate-900/60 dark:bg-black/80 z-[100] hidden flex justify-center items-center px-4 backdrop-blur-md overflow-y-auto py-8"></div>
<div id="pinContainer" class="fixed inset-0 bg-slate-900/70 dark:bg-black/85 z-[150] hidden flex justify-center items-end backdrop-blur-md"></div>
<div id="toast-container" class="fixed top-6 right-4 z-[300] flex flex-col gap-2 pointer-events-none"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm';

/* ---------------- state ---------------- */
window.supa = null;
window.session = null;
window.profile = null;
window.adminToken = localStorage.getItem('vault_admin_token') || null;
window.activeTab = localStorage.getItem('vault_tab') || 'dashboard';
window.txns = [];
window.feedbackList = [];
window.CFG = {};
window.logoTapCount = 0;
window.pendingAvatarBlob = null;

const INCOME_CATS = ['বাসা থেকে','টিউশনি','ফ্রিল্যান্স','বেতন/জব','বোনাস','ধার পেয়েছি','অন্যান্য আয়'];
const EXPENSE_CATS = ['খাবার','যাতায়াত','বাসা ভাড়া','কেনাকাটা','পড়াশোনা','বিল (কারেন্ট/ওয়াইফাই)','চিকিৎসা','বিনোদন','ধার দিয়েছি','অন্যান্য খরচ'];
const BN_DAYS = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];

const refId = () => Math.random().toString(36).substr(2,6).toUpperCase();
const bnNum = (n) => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);

/* ---------------- toast / modal ---------------- */
window.showToast = (msg, type='success') => {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  const colors = type==='success' ? 'bg-vEmerald text-[#04150c]' : (type==='error' ? 'bg-vRose text-white' : 'bg-slate-800 text-white');
  t.className = `toast-in flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl ${colors} text-sm font-bold max-w-xs border border-white/10`;
  t.innerHTML = `<i data-lucide="${type==='success'?'check-circle':'alert-circle'}" class="w-5 h-5 shrink-0"></i><span>${msg}</span>`;
  c.appendChild(t); lucide.createIcons();
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(20px)'; t.style.transition='all .3s'; setTimeout(()=>t.remove(),300); }, 3200);
};

window.showModal = (html) => {
  const mc = document.getElementById('modalContainer');
  mc.innerHTML = `<div class="glass w-full max-w-lg rounded-3xl p-6 border pop-in shadow-2xl relative my-auto max-h-[85vh] overflow-y-auto hide-scrollbar">${html}</div>`;
  mc.classList.remove('hidden'); lucide.createIcons();
  mc.onclick = (e)=>{ if(e.target===mc) window.hideModal(); };
};
window.hideModal = () => document.getElementById('modalContainer').classList.add('hidden');

/* ---------------- floating PIN keypad ---------------- */
window.askPin = (title, subtitle='') => {
  return new Promise((resolve, reject) => {
    const pc = document.getElementById('pinContainer');
    let entered = '';
    const render = () => {
      pc.innerHTML = `
      <div class="w-full max-w-md glass rounded-t-[36px] border-t border-x p-6 pb-8 pop-in">
        <div class="w-10 h-1.5 bg-slate-400/30 rounded-full mx-auto mb-5"></div>
        <div class="text-center mb-6">
          <div class="w-12 h-12 bg-vGold/10 text-vGold rounded-2xl flex items-center justify-center mx-auto mb-3 border border-vGold/20"><i data-lucide="lock-keyhole" class="w-6 h-6"></i></div>
          <h3 class="disp font-bold text-xl">${title}</h3>
          ${subtitle ? `<p class="text-xs text-slate-500 mt-1">${subtitle}</p>` : ''}
        </div>
        <div class="flex justify-center gap-3 mb-7" id="pinDots">
          ${[0,1,2,3,4,5].map(i=>`<div class="dot ${i<entered.length?'filled':''}"></div>`).join('')}
        </div>
        <div class="grid grid-cols-3 gap-3 max-w-xs mx-auto">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="key-btn py-4 rounded-2xl bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/5 disp text-xl font-bold" data-k="${n}">${bnNum(n)}</button>`).join('')}
          <button type="button" class="key-btn py-4 rounded-2xl text-slate-400 font-bold text-xs" data-k="cancel">বাতিল</button>
          <button type="button" class="key-btn py-4 rounded-2xl bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/5 disp text-xl font-bold" data-k="0">০</button>
          <button type="button" class="key-btn py-4 rounded-2xl text-vRose flex items-center justify-center" data-k="back"><i data-lucide="delete" class="w-5 h-5"></i></button>
        </div>
      </div>`;
      lucide.createIcons();
      pc.querySelectorAll('[data-k]').forEach(btn => btn.onclick = () => {
        const k = btn.dataset.k;
        if (k === 'cancel') { pc.classList.add('hidden'); reject(new Error('cancelled')); return; }
        if (k === 'back') { entered = entered.slice(0,-1); render(); return; }
        if (entered.length < 6) entered += k;
        if (entered.length === 6) { pc.classList.add('hidden'); resolve(entered); return; }
        render();
      });
    };
    pc.classList.remove('hidden');
    render();
  });
};

/* ---------------- API helper ---------------- */
window.callApi = async (path, body) => {
  const res = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || 'সার্ভার এরর');
  return json;
};

window.notify = (event, details) => {
  if (!window.session) return;
  window.callApi('/api/notify', { event, accessToken: window.session.access_token, details }).catch(()=>{});
};

/* ---------------- auth ---------------- */
window.loginGoogle = async () => {
  await window.supa.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.origin + window.location.pathname } });
};
window.logout = async () => {
  await window.supa.auth.signOut();
  window.adminToken = null; localStorage.removeItem('vault_admin_token');
  window.profile = null; window.session = null;
  window.render();
};

/* ---------------- data loading ---------------- */
window.loadProfile = async () => {
  const { data } = await window.supa.from('profiles').select('id, full_name, email, avatar_url, pin_set, is_suspended, suspend_reason').eq('id', window.session.user.id).single();
  window.profile = data;
};
window.loadTxns = async () => {
  const { data } = await window.supa.from('transactions').select('*').eq('user_id', window.session.user.id).order('txn_date', { ascending:false }).order('created_at', { ascending:false });
  window.txns = data || [];
};
window.loadFeedback = async () => {
  const { data } = await window.supa.from('feedback').select('*').eq('user_id', window.session.user.id).order('created_at', { ascending:false });
  window.feedbackList = data || [];
};

/* ---------------- render root ---------------- */
window.render = () => {
  const root = document.getElementById('root');
  if (!window.session) { root.innerHTML = buildLanding(); lucide.createIcons(); return; }
  if (window.profile && window.profile.is_suspended) { root.innerHTML = buildSuspended(); lucide.createIcons(); return; }
  if (window.profile && !window.profile.pin_set) { root.innerHTML = buildShell(''); lucide.createIcons(); setTimeout(forceSetPin, 300); return; }
  root.innerHTML = buildShell(buildTabContent());
  lucide.createIcons();
  updateNav();
  document.getElementById('main-scroll')?.scrollTo(0,0);
};

/* ---------------- landing (logged out) ---------------- */
function buildLanding(){
  return `
  <div class="flex-1 flex flex-col items-center justify-center px-6 text-center overflow-y-auto hide-scrollbar py-10">
    <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-vEmerald to-vGold flex items-center justify-center shadow-2xl shadow-vEmerald/20 mb-6"><i data-lucide="vault" class="w-10 h-10 text-[#04150c]"></i></div>
    <h1 class="disp text-4xl font-extrabold mb-2">Vault</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 max-w-xs mb-8 leading-relaxed">আপনার ব্যক্তিগত আয়-ব্যয়ের সম্পূর্ণ গোপনীয় হিসাব। শুধু আপনি দেখতে পারবেন — একদম নিরাপদ, একদম ব্যক্তিগত।</p>
    <button type="button" onclick="window.loginGoogle()" class="flex items-center gap-3 bg-white dark:bg-white text-slate-800 px-6 py-4 rounded-2xl font-bold shadow-xl active:scale-95 transition-all border border-slate-200">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.47c-.28 1.5-1.13 2.78-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.88-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.11C3.25 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.37-2.28V6.61H1.27A11.98 11.98 0 0 0 0 12c0 1.94.46 3.77 1.27 5.39l4-3.11z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.61l4 3.11C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
      গুগল দিয়ে লগইন করুন
    </button>
    <p class="text-[11px] text-slate-500 mt-6">লগইন করলেই আপনার নাম, ইমেইল ও প্রোফাইল ছবি স্বয়ংক্রিয়ভাবে সেভ হবে।</p>
    ${footerCredit()}
  </div>`;
}

function buildSuspended(){
  const wa = window.CFG.developerWhatsapp;
  return `
  <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">
    <div class="w-16 h-16 rounded-3xl bg-vRose/10 text-vRose flex items-center justify-center mb-5 border border-vRose/20"><i data-lucide="shield-off" class="w-8 h-8"></i></div>
    <h2 class="disp text-2xl font-bold mb-2">একাউন্ট সাসপেন্ড করা হয়েছে</h2>
    <p class="text-sm text-slate-500 max-w-xs mb-1">${window.profile.suspend_reason || 'নিয়ম লঙ্ঘনের কারণে আপনার একাউন্টটি সাময়িকভাবে বন্ধ রাখা হয়েছে।'}</p>
    <p class="text-xs text-slate-500 mb-6">বিস্তারিত জানতে ডেভেলপারের সাথে যোগাযোগ করুন।</p>
    <div class="flex flex-col gap-3 w-full max-w-xs">
      ${wa ? `<a href="${wa}" target="_blank" class="py-3.5 bg-emerald-600 text-white rounded-2xl font-bold flex items-center justify-center gap-2"><i data-lucide="message-circle" class="w-4 h-4"></i> WhatsApp এ যোগাযোগ করুন</a>` : ''}
      <button type="button" onclick="window.logout()" class="py-3.5 bg-slate-200 dark:bg-slate-800 rounded-2xl font-bold">লগআউট</button>
    </div>
  </div>`;
}

  return `

/* ---------------- app shell (logged in) ---------------- */
function buildShell(innerHtml){
  const p = window.profile || {};
  const isSuper = window.adminToken;
  return `
  <header class="glass z-40 shrink-0 border-b px-4 py-3 relative">
    <div class="max-w-5xl mx-auto flex justify-between items-center gap-2">
      <div class="flex items-center gap-3 min-w-0 cursor-pointer select-none" onclick="window.handleLogoTap()">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-vEmerald to-vGold flex items-center justify-center shadow-lg shrink-0"><i data-lucide="vault" class="w-5 h-5 text-[#04150c]"></i></div>
        <div class="min-w-0"><h1 class="disp text-lg font-bold leading-none">Vault</h1><p class="text-[10px] text-slate-500 font-bold tracking-widest uppercase">Fund Tracker</p></div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button type="button" onclick="window.toggleTheme()" class="relative w-11 h-6 rounded-full bg-slate-300 dark:bg-slate-700 flex items-center p-1 border border-slate-300 dark:border-slate-800" id="themeBtn">
          <div id="themeSlider" class="w-4 h-4 rounded-full bg-white shadow-md transform transition-transform duration-300"></div>
        </button>
        <img src="${p.avatar_url || 'https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent(p.full_name||'U')}" class="w-9 h-9 rounded-full object-cover border-2 border-vEmerald/40 cursor-pointer" onclick="window.changeTab('profile')">
      </div>
    </div>
  </header>

  <div id="main-scroll" class="flex-1 overflow-y-auto w-full pb-32 pt-5 px-4 md:px-6 hide-scrollbar">
    <main class="max-w-5xl mx-auto fade-in">${innerHtml}</main>
  </div>

  <nav class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[95%] max-w-md glass z-40 rounded-2xl border shadow-2xl">
    <div class="flex justify-around items-center h-16 px-1">
      <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1" onclick="window.changeTab('dashboard')" data-tab="dashboard"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[9px] disp font-bold uppercase tracking-wider mt-0.5">হোম</span></button>
      <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1" onclick="window.changeTab('add')" data-tab="add"><i data-lucide="plus-circle" class="w-5 h-5"></i><span class="text-[9px] disp font-bold uppercase tracking-wider mt-0.5">এন্ট্রি</span></button>
      <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1" onclick="window.changeTab('history')" data-tab="history"><i data-lucide="history" class="w-5 h-5"></i><span class="text-[9px] disp font-bold uppercase tracking-wider mt-0.5">হিস্ট্রি</span></button>
      ${isSuper ? `<button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1" onclick="window.changeTab('manage')" data-tab="manage"><i data-lucide="shield" class="w-5 h-5"></i><span class="text-[9px] disp font-bold uppercase tracking-wider mt-0.5">ম্যানেজ</span></button>` : ''}
      <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1" onclick="window.changeTab('profile')" data-tab="profile"><i data-lucide="user-circle" class="w-5 h-5"></i><span class="text-[9px] disp font-bold uppercase tracking-wider mt-0.5">প্রোফাইল</span></button>
    </div>
  </nav>`;
}

window.handleLogoTap = () => {
  window.logoTapCount++;
  if (window.logoTapCount >= 5) { window.logoTapCount = 0; window.openMasterKeyModal(); }

function buildTabContent(){
  if (window.activeTab === 'dashboard') return buildDashboard();

/* ---------------- dashboard ---------------- */
function monthProgress(){
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const day = now.getDate();
  const left = daysInMonth - day;
  const pct = day / daysInMonth;
  return { day, daysInMonth, left, pct };
}

function buildDashboard(){
  const income = window.txns.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const expense = window.txns.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const balance = income - expense;
  const now = new Date();
  const mp = monthProgress();
  const r = 42, circ = 2*Math.PI*r;
  const offset = circ * (1 - mp.pct);
  const dateStr = `${BN_MONTHS[now.getMonth()]} ${bnNum(now.getDate())}, ${bnNum(now.getFullYear())}`;

  let html = `
  <div class="cut glass border p-6 md:p-8 relative overflow-hidden mb-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
      <div>

        <h2 class="disp text-2xl md:text-3xl font-bold mb-1">${dateStr}</h2>
        <p class="text-sm text-slate-500 font-semibold">স্বাগতম, ${window.profile.full_name || 'বন্ধু'}</p>
      </div>
      <div class="flex items-center gap-4 shrink-0">
        <svg width="100" height="100" viewBox="0 0 100 100" class="-rotate-90">
          <circle cx="50" cy="50" r="${r}" fill="none" stroke-width="8" class="ring-track"></circle>
          <circle cx="50" cy="50" r="${r}" fill="none" stroke-width="8" class="ring-prog" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"></circle>
          <text x="50" y="46" text-anchor="middle" fill="currentColor" font-size="22" font-weight="800" transform="rotate(90 50 50)" font-family="Sora">${bnNum(mp.left)}</text>
          <text x="50" y="63" text-anchor="middle" fill="currentColor" opacity="0.5" font-size="9" transform="rotate(90 50 50)" font-family="Hind Siliguri">দিন বাকি</text>
        </svg>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4 mb-6">

    ${statCard('মোট ব্যয়', '৳'+bnNum(expense), 'arrow-up-circle', 'from-vRose to-rose-700', ()=>window.changeTab('add'))}

      <span class="text-[10px] font-bold uppercase tracking-widest text-white/90 block mb-1">মোট ফান্ডে আছে</span>

window.submitEntry = async () => {
  const btn = document.getElementById('entrySaveBtn');
  const og = btn.innerHTML; btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin mx-auto"></i>'; btn.disabled = true; lucide.createIcons();
  try {
    const amount = Number(document.getElementById('entryAmount').value);
    if (!amount || amount <= 0) throw new Error('সঠিক পরিমাণ দিন');
    const row = {
      user_id: window.session.user.id,
      type: window._entryType,
      category: document.getElementById('entryCategory').value,
      source_place: document.getElementById('entrySource').value || null,
      amount,
      note: document.getElementById('entryNote').value || null,
      txn_date: document.getElementById('entryDate').value,
      ref_id: refId()
    };
    const { error } = await window.supa.from('transactions').insert([row]);
    if (error) throw error;
    window.showToast('এন্ট্রি সেভ হয়েছে!');
    window.notify('transaction_add', row);
    await window.loadTxns();
    document.getElementById('entryAmount').value = '';
    document.getElementById('entrySource').value = '';
    document.getElementById('entryNote').value = '';
    window.changeTab('dashboard');
  } catch(e){ window.showToast(e.message, 'error'); btn.innerHTML = og; btn.disabled = false; lucide.createIcons(); }
};

window.uploadAvatar = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5*1024*1024) return window.showToast('ছবির সাইজ ৫MB এর কম হতে হবে', 'error');
  try {
    window.showToast('ছবি আপলোড হচ্ছে...', 'info');
    const path = `${window.session.user.id}/avatar_${Date.now()}.jpg`;
    const { error: upErr } = await window.supa.storage.from('avatars').upload(path, file, { contentType: file.type, upsert: true });
    if (upErr) throw upErr;
    const { data: pub } = window.supa.storage.from('avatars').getPublicUrl(path);
    const { error } = await window.supa.from('profiles').update({ avatar_url: pub.publicUrl }).eq('id', window.session.user.id);
    if (error) throw error;
    await window.loadProfile();
    window.render();
    window.showToast('প্রোফাইল ছবি পরিবর্তন হয়েছে!');
  } catch(err){ window.showToast(err.message, 'error'); }
};

  try {
    const p1 = await window.askPin('স্বাগতম! আপনার নিরাপত্তা পিন সেট করুন', 'প্রথমবার তাই ৬ সংখ্যার একটি পিন দিন');
    const p2 = await window.askPin('আবার পিন দিন', 'নিশ্চিত করার জন্য একই পিন আবার দিন');
    if (p1 !== p2) { window.showToast('দুইবারের পিন মিলেনি, আবার চেষ্টা করুন', 'error'); return setTimeout(forceSetPin, 400); }
    await window.callApi('/api/pin', { action:'set', pin:p1, accessToken: window.session.access_token });
    await window.loadProfile();
    window.showToast('পিন সেট হয়েছে! স্বাগতম।');
    window.render();
  } catch(e){ if (e.message !== 'cancelled') { window.showToast(e.message,'error'); setTimeout(forceSetPin, 400); } else setTimeout(forceSetPin, 300); }
}

window.changePin = async () => {
  try {
    const oldPin = await window.askPin('পুরাতন পিন দিন');
    const p1 = await window.askPin('নতুন পিন দিন');
    const p2 = await window.askPin('আবার নতুন পিন দিন');
    if (p1 !== p2) return window.showToast('নতুন পিন দুইবার মিলেনি', 'error');
    await window.callApi('/api/pin', { action:'set', pin:p1, oldPin, accessToken: window.session.access_token });
    window.showToast('পিন সফলভাবে পরিবর্তন হয়েছে!');
  } catch(e){ if (e.message !== 'cancelled') window.showToast(e.message, 'error'); }
};

window.fullReset = async () => {
  try {
    const pin1 = await window.askPin('পিন দিন (ধাপ ১/২)', 'সম্পূর্ণ হিস্ট্রি রিসেট নিশ্চিত করুন');
    await window.callApi('/api/pin', { action:'verify', pin: pin1, accessToken: window.session.access_token });
    const pin2 = await window.askPin('আবার পিন দিন (ধাপ ২/২)', 'এই কাজটি আর ফিরিয়ে আনা যাবে না');
    await window.callApi('/api/pin', { action:'verify', pin: pin2, accessToken: window.session.access_token });
    const { error } = await window.supa.from('transactions').delete().eq('user_id', window.session.user.id);
    if (error) throw error;
    window.showToast('সম্পূর্ণ হিস্ট্রি রিসেট হয়েছে');
    window.notify('full_reset', {});
    await window.loadTxns();
    window.changeTab('dashboard');
  } catch(e){ if (e.message !== 'cancelled') window.showToast(e.message, 'error'); }
};

/* ---------------- master key / admin ---------------- */
window.openMasterKeyModal = () => {
  window.showModal(`
    <div class="text-center mb-6"><div class="w-14 h-14 bg-vIndigo/10 text-vIndigo rounded-full flex items-center justify-center mx-auto mb-3 border border-vIndigo/20"><i data-lucide="key-round" class="w-7 h-7"></i></div><h3 class="disp text-2xl font-bold">Master Key</h3><p class="text-xs text-slate-500 mt-2">সুপার এডমিন অ্যাক্সেসের জন্য মাস্টার-কী দিন</p></div>
    <input type="password" id="masterKeyInput" class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-black/30 border text-lg text-center tracking-widest font-mono outline-none" placeholder="••••••••">
    <div class="flex gap-3 mt-6"><button type="button" onclick="window.hideModal()" class="flex-1 py-4 text-sm bg-slate-200 dark:bg-slate-800 rounded-xl font-bold">বাতিল</button><button type="button" id="mk-ok" class="flex-1 py-4 text-sm bg-vIndigo text-white rounded-xl font-bold">Enter</button></div>
  `);
  document.getElementById('mk-ok').onclick = async () => {
    const btn = document.getElementById('mk-ok'); const og = btn.innerHTML; btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin mx-auto"></i>'; lucide.createIcons();
    try {
      const masterKey = document.getElementById('masterKeyInput').value;
      const json = await window.callApi('/api/master-verify', { masterKey, accessToken: window.session.access_token });
      window.adminToken = json.token; localStorage.setItem('vault_admin_token', json.token);
      window.hideModal(); window.showToast('Master Access Granted'); window.changeTab('manage');
    } catch(e){ window.showToast(e.message, 'error'); btn.innerHTML = og; }
  };
};

window._manageUsers = [];
async function loadManageUsers(){
  try {
    const json = await fetch('/api/admin', { method:'POST', headers:{'Content-Type':'application/json','x-admin-token':window.adminToken}, body: JSON.stringify({ action:'list_users' }) }).then(r=>r.json());
    window._manageUsers = json.users || [];
    window.render();
  } catch(e){}
}

function buildManage(){
  if (!window._manageUsers.length) { setTimeout(loadManageUsers, 50); }
  return `
  <h2 class="disp text-2xl font-bold mb-5 flex items-center gap-2"><i data-lucide="shield" class="w-6 h-6 text-vIndigo"></i> ম্যানেজ প্যানেল</h2>
  <div class="space-y-4">
    ${window._manageUsers.map(u=>`
      <div class="glass border rounded-3xl p-5 ${u.is_suspended?'border-vRose/40':''}">
        <div class="flex items-center gap-3 mb-3">
          <img src="${u.avatar_url || 'https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent(u.full_name||'U')}" class="w-11 h-11 rounded-full object-cover border">
          <div class="min-w-0 flex-1"><p class="font-bold text-sm truncate">${u.full_name||'—'}</p><p class="text-[10px] text-slate-500 mono truncate">${u.email}</p></div>
          ${u.is_suspended ? `<span class="text-[9px] font-bold bg-vRose/10 text-vRose px-2 py-1 rounded-lg border border-vRose/20">SUSPENDED</span>` : ''}
        </div>
        <div class="grid grid-cols-3 gap-2 mb-3 text-center">
          <div class="bg-slate-50 dark:bg-black/20 p-2 rounded-xl"><p class="text-[9px] text-slate-500 font-bold uppercase">আয়</p><p class="font-bold text-vEmerald text-sm">৳${u.totalIncome}</p></div>
          <div class="bg-slate-50 dark:bg-black/20 p-2 rounded-xl"><p class="text-[9px] text-slate-500 font-bold uppercase">ব্যয়</p><p class="font-bold text-vRose text-sm">৳${u.totalExpense}</p></div>
          <div class="bg-slate-50 dark:bg-black/20 p-2 rounded-xl"><p class="text-[9px] text-slate-500 font-bold uppercase">ব্যালেন্স</p><p class="font-bold text-vGold text-sm">৳${u.balance}</p></div>
        </div>
        <div class="flex gap-2">
          <button type="button" onclick="window.sendFeedbackModal('${u.id}')" class="flex-1 py-2.5 bg-vIndigo/10 text-vIndigo border border-vIndigo/20 rounded-xl text-xs font-bold">ফিডব্যাক দিন</button>
          ${u.is_suspended
            ? `<button type="button" onclick="window.toggleSuspend('${u.id}', false)" class="flex-1 py-2.5 bg-vEmerald/10 text-vEmerald border border-vEmerald/20 rounded-xl text-xs font-bold">আনসাসপেন্ড</button>`
            : `<button type="button" onclick="window.toggleSuspend('${u.id}', true)" class="flex-1 py-2.5 bg-vRose/10 text-vRose border border-vRose/20 rounded-xl text-xs font-bold">সাসপেন্ড</button>`}
        </div>
      </div>
    `).join('') || `<div class="p-10 text-center text-slate-500 text-sm">লোড হচ্ছে...</div>`}
  </div>`;
}

window.toggleSuspend = async (id, suspend) => {
  try {
    await fetch('/api/admin', { method:'POST', headers:{'Content-Type':'application/json','x-admin-token':window.adminToken}, body: JSON.stringify({ action: suspend?'suspend_user':'unsuspend_user', payload:{ id, reason: suspend?'নিয়ম লঙ্ঘন':null } }) });
    window.showToast(suspend ? 'ইউজার সাসপেন্ড করা হয়েছে' : 'ইউজার আনসাসপেন্ড করা হয়েছে');
    await loadManageUsers();
  } catch(e){ window.showToast('এরর হয়েছে', 'error'); }
};

window.sendFeedbackModal = (userId) => {
  window.showModal(`
    <h3 class="disp text-xl font-bold mb-4">ফিডব্যাক পাঠান</h3>
    <textarea id="fbMsg" rows="4" placeholder="মেসেজ লিখুন..." class="w-full p-4 rounded-xl bg-slate-50 dark:bg-slate-900 border text-sm outline-none"></textarea>
    <div class="flex gap-3 mt-5"><button type="button" onclick="window.hideModal()" class="flex-1 py-3.5 bg-slate-200 dark:bg-slate-800 rounded-xl font-bold text-sm">বাতিল</button><button type="button" onclick="window.doSendFeedback('${userId}')" class="flex-1 py-3.5 bg-vIndigo text-white rounded-xl font-bold text-sm">পাঠান</button></div>
  `);
};
window.doSendFeedback = async (userId) => {
  const msg = document.getElementById('fbMsg').value;
  if (!msg) return window.showToast('মেসেজ লিখুন', 'error');
  try {
    await fetch('/api/admin', { method:'POST', headers:{'Content-Type':'application/json','x-admin-token':window.adminToken}, body: JSON.stringify({ action:'send_feedback', payload:{ user_id:userId, message:msg } }) });
    window.hideModal(); window.showToast('ফিডব্যাক পাঠানো হয়েছে');
  } catch(e){ window.showToast('এরর হয়েছে', 'error'); }
};

/* ---------------- boot ---------------- */
async function boot(){
  try {
    window.CFG = await fetch('/api/config').then(r=>r.json());
    window.supa = createClient(window.CFG.supabaseUrl, window.CFG.supabaseAnonKey);

    const { data: { session } } = await window.supa.auth.getSession();
    window.session = session;

    window.supa.auth.onAuthStateChange(async (event, s) => {
      window.session = s;
      if (s) { await window.loadProfile(); await window.loadTxns(); await window.loadFeedback(); if (event==='SIGNED_IN') window.notify('login', {}); }
      window.render();
    });

    if (window.session) { await window.loadProfile(); await window.loadTxns(); await window.loadFeedback(); }
    window.render();
    if (window.activeTab === 'add') setTimeout(()=>window.setEntryType('income'), 60);
  } catch(e) {
    document.getElementById('root').innerHTML = `<div class="flex-1 flex items-center justify-center text-center px-6"><p class="text-sm text-slate-500">লোড করতে সমস্যা হয়েছে। পেজ রিফ্রেশ করুন।</p></div>`;
  } finally {
    const boot = document.getElementById('boot');
    boot.classList.add('boot-hide');
    setTimeout(()=>boot.remove(), 400);
  }
}
boot();
</script>
</body>
</html>
